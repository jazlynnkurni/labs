<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chooser lab</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#14171B;--ink3:rgba(20,23,27,.42);--hair:rgba(20,23,27,.16);--paper:#fff;--flick-a:#A99939;--flick-b:#340414;--ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.33,1.18,.37,1)}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#fff;overflow:hidden}
body{font:400 14px/1.4 "Plus Jakarta Sans",sans-serif;color:var(--ink)}
/* lab chrome: tabs at the bottom, out of the way */
.tabs{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:4px;padding:4px;border-radius:999px;background:#F6F6F4;box-shadow:inset 0 0 0 1px rgba(20,23,27,.06);z-index:50}
.tabs button{border:0;background:transparent;font:500 13px "Plus Jakarta Sans";padding:9px 16px;border-radius:999px;cursor:pointer;color:rgba(20,23,27,.55)}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(20,23,27,.06),0 4px 14px rgba(20,23,27,.07)}
.note{position:fixed;left:0;right:0;bottom:78px;text-align:center;font:italic 300 13px "Helvetica Neue",Helvetica,Arial;color:var(--ink3);z-index:50;pointer-events:none}

/* the stage and the two covers. The covers are always whole: 16:9, never cropped. */
.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;gap:2.2vw;padding:0 4vw 60px}
.c{display:block;position:relative;border-radius:22px;overflow:hidden;background:#fff;cursor:pointer;
  box-shadow:0 0 0 1px rgba(20,23,27,.07),0 2px 6px rgba(20,23,27,.05),0 30px 56px -28px rgba(52,4,20,.32)}
.c img{display:block;width:100%;aspect-ratio:16/9;height:auto;pointer-events:none;user-select:none}

/* 01 SHARE: the row is one width; the hovered cover takes more of it, the other gives it up. Both stay 16:9, so heights follow. */
.m1 .c{flex:1 1 0;transition:flex-grow .75s var(--ease),box-shadow .5s ease}
.m1.l .c.a,.m1.r .c.b{flex-grow:1.9}

/* 02 SHOULDER: the hovered cover grows and walks into the other's half; the other is pushed back, smaller, underneath */
.m2 .c{position:absolute;top:50%;width:45vw;transition:transform .8s var(--ease),filter .6s ease,z-index 0s .4s}
.m2 .c.a{left:3.5vw}.m2 .c.b{right:3.5vw}
.m2 .c{transform:translateY(calc(-50% - 30px))}
.m2.l .c.a{transform:translate(8vw,calc(-50% - 30px)) scale(1.16);z-index:3;transition-delay:0s}
.m2.l .c.b{transform:translate(4vw,calc(-50% - 30px)) scale(.8);z-index:1;filter:saturate(.7) brightness(.97)}
.m2.r .c.b{transform:translate(-8vw,calc(-50% - 30px)) scale(1.16);z-index:3;transition-delay:0s}
.m2.r .c.a{transform:translate(-4vw,calc(-50% - 30px)) scale(.8);z-index:1;filter:saturate(.7) brightness(.97)}

/* 03 TURN: in perspective. The hovered cover faces you and comes forward; the other turns its shoulder away */
.m3{perspective:1600px}
.m3 .c{flex:0 0 41vw;transition:transform .9s var(--ease),filter .6s ease}
.m3 .c.a{transform-origin:100% 50%}.m3 .c.b{transform-origin:0 50%}
.m3.l .c.a{transform:translateX(5vw) translateZ(80px)}
.m3.l .c.b{transform:translateX(-1vw) rotateY(34deg) translateZ(-120px);filter:brightness(.96)}
.m3.r .c.b{transform:translateX(-5vw) translateZ(80px)}
.m3.r .c.a{transform:translateX(1vw) rotateY(-34deg) translateZ(-120px);filter:brightness(.96)}

/* 04 DECK: the two overlap like cards held in a hand. Hover one and it slides out on top; the other tucks back under */
.m4 .c{position:absolute;top:50%;width:48vw;transition:transform .85s var(--spring),z-index 0s .25s}
.m4 .c.a{left:calc(50% - 44vw);transform:translateY(calc(-50% - 30px)) rotate(-2.5deg);z-index:2}
.m4 .c.b{left:calc(50% - 4vw);transform:translateY(calc(-50% - 30px)) rotate(2.5deg);z-index:1}
.m4.l .c.a{transform:translate(3vw,calc(-50% - 30px)) rotate(0) scale(1.06);z-index:3;transition-delay:0s}
.m4.l .c.b{transform:translate(3vw,calc(-50% - 22px)) rotate(4deg) scale(.9)}
.m4.r .c.b{transform:translate(-3vw,calc(-50% - 30px)) rotate(0) scale(1.06);z-index:3;transition-delay:0s}
.m4.r .c.a{transform:translate(-3vw,calc(-50% - 22px)) rotate(-4deg) scale(.9)}

/* 05 LEAN: no fixed states. The split follows the pointer on a spring, so the covers wrestle for the row as you move */
.m5 .c{flex:0 0 auto}

/* the click: the chosen cover takes the whole screen, the other leaves, then the loader */
.go-out{transition:transform .7s var(--ease),opacity .45s ease!important;opacity:0!important}
#load{position:fixed;inset:0;z-index:200;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;opacity:0;animation:ld-in .3s ease forwards}
#load .ld{position:relative;display:flex;height:40px;width:min(300px,70vw)}
#load .ld i{position:absolute;left:0;right:0;height:1px;background:var(--hair);transform:scaleX(0);transform-origin:left center;animation:ld-rule 560ms var(--ease) forwards}
#load .ld i.head{top:0}#load .ld i.foot{bottom:0;animation-delay:120ms}
#load .lc{flex:0 0 auto;height:40px;position:relative;transition:background 160ms ease}
#load .lc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:1px;background:var(--hair);transform:scaleY(0);transform-origin:top;animation:ld-stem 420ms var(--ease) forwards;animation-delay:var(--d)}
#load .lc:last-child::after{content:"";position:absolute;right:0;top:0;bottom:0;width:1px;background:var(--hair);transform:scaleY(0);transform-origin:top;animation:ld-stem 420ms var(--ease) forwards;animation-delay:calc(var(--d) + 70ms)}
#load .lc.on{background:var(--flick-b)}#load .lc.on.g{background:var(--flick-a)}
#load span{font:300 12.5px "Helvetica Neue",Helvetica,Arial;letter-spacing:.08em;color:var(--ink3)}
@keyframes ld-in{to{opacity:1}}@keyframes ld-rule{to{transform:scaleX(1)}}@keyframes ld-stem{to{transform:scaleY(1)}}
</style></head><body>
<div class="stage m1" id="st">
  <a class="c a" href="#clover"><img src="cover-clover.jpg" alt="Eden case study"></a>
  <a class="c b" href="#manus"><img src="cover-manus.jpg" alt="Manus AI case study"></a>
</div>
<p class="note" id="note"></p>
<div class="tabs" id="tabs"></div>
<script>
const NOTES={
  1:'01 Share. One row; the hovered cover takes more of it and the other gives it up. Both stay whole.',
  2:'02 Shoulder. The hovered cover grows into the other’s half and pushes it back underneath.',
  3:'03 Turn. The hovered cover faces you; the other turns its shoulder away in perspective.',
  4:'04 Deck. Overlapping like two cards in a hand; the hovered one slides out on top.',
  5:'05 Lean. The split follows the pointer on a spring, so the two wrestle for the row as you move.'};
const st=document.getElementById('st'), A=st.querySelector('.a'), B=st.querySelector('.b'), note=document.getElementById('note');
let mode=+(new URLSearchParams(location.search).get('v')||1), busy=false;
const tabs=document.getElementById('tabs');
for(let i=1;i<=5;i++){ const b=document.createElement('button'); b.textContent='0'+i; b.onclick=()=>set(i); tabs.appendChild(b); }
function set(m){ mode=m; history.replaceState(null,'','?v='+m); st.className='stage m'+m; [A,B].forEach(c=>{c.style.cssText='';});
  [...tabs.children].forEach((b,i)=>b.classList.toggle('on',i+1===m)); note.textContent=NOTES[m]; if(m===5) lean.start(); else lean.stop(); }
/* hover: which side is winning */
[A,B].forEach(c=>{ c.addEventListener('pointerenter',()=>{ if(busy||mode===5) return; st.classList.remove('l','r'); st.classList.add(c===A?'l':'r'); });
  c.addEventListener('pointerleave',()=>{ if(busy||mode===5) return; st.classList.remove('l','r'); }); });

/* 05: a spring on the split. The target share comes from the pointer's x; the share drives each cover's width */
const lean=(()=>{ let raf=0, s=.5, v=0, target=.5, prev=0;
  function px(){ const W=innerWidth*.92-innerWidth*.022; return W; }
  function frame(now){ const dt=Math.min(.033,(now-prev)/1000||.016); prev=now;
    const k=90, d=14; v+=(k*(target-s)-d*v)*dt; s+=v*dt;
    const W=px(); A.style.width=(W*s).toFixed(1)+'px'; B.style.width=(W*(1-s)).toFixed(1)+'px';
    raf=requestAnimationFrame(frame); }
  function move(e){ if(busy) return; const x=e.clientX/innerWidth; target=.5-Math.max(-1,Math.min(1,(x-.5)*2.2))*.17; }
  function out(){ target=.5; }
  return { start(){ cancelAnimationFrame(raf); s=.5; v=0; target=.5; prev=performance.now(); addEventListener('pointermove',move); document.addEventListener('pointerleave',out); raf=requestAnimationFrame(frame); },
           stop(){ cancelAnimationFrame(raf); removeEventListener('pointermove',move); document.removeEventListener('pointerleave',out); } };
})();

/* the click, the same in every direction: the chosen cover grows to the whole screen (FLIP), the other leaves the way it was losing, then the loader */
[A,B].forEach(c=>c.addEventListener('click',e=>{ e.preventDefault(); if(busy) return; busy=true; lean.stop();
  const other=c===A?B:A; const r=c.getBoundingClientRect();
  const W=Math.min(innerWidth, innerHeight*16/9), H=W*9/16; const tx=(innerWidth-W)/2, ty=(innerHeight-H)/2;
  const clone=c.cloneNode(true); Object.assign(clone.style,{position:'fixed',left:r.left+'px',top:r.top+'px',width:r.width+'px',margin:0,zIndex:100,transform:'none',transition:'none',filter:'none'});
  document.body.appendChild(clone); c.style.visibility='hidden';
  other.style.transition='transform .7s var(--ease),opacity .45s ease'; other.style.opacity='0';
  other.style.transform=(other.style.transform||getComputedStyle(other).transform.replace('none',''))+` translateX(${other===A?-12:12}vw)`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ clone.style.transition='left .8s var(--ease),top .8s var(--ease),width .8s var(--ease),border-radius .8s var(--ease),box-shadow .8s ease';
    Object.assign(clone.style,{left:tx+'px',top:ty+'px',width:W+'px',borderRadius:'0px',boxShadow:'none'}); }));
  setTimeout(()=>loader(()=>{ clone.remove(); c.style.visibility=''; busy=false; set(mode); st.classList.remove('l','r'); }),850);
}));
function loader(done){ const host=document.createElement('div'); host.id='load'; host.innerHTML='<div class="ld"><i class="head"></i><i class="foot"></i></div><span>loading</span>'; document.body.appendChild(host);
  const row=host.querySelector('.ld'); const N=7, cells=[]; for(let i=0;i<N;i++){ const c=document.createElement('span'); c.className='lc'; c.style.setProperty('--d',(120+i*60)+'ms'); row.appendChild(c); cells.push(c); }
  let deal; do{ deal=cells.map(()=>Math.random()<.5); }while(deal.filter(Boolean).length<2||deal.filter(x=>!x).length<2); deal.forEach((g,i)=>{ if(g) cells[i].classList.add('g'); });
  const t0=performance.now(); let inked=-1;
  (function frame(now){ const t=(now-t0)/1000; const W=row.clientWidth; let sum=0; const ws=[]; for(let i=0;i<N;i++){ const k=.5+.5*Math.sin(t*.9*Math.PI+i*1.258); const w=1+k*k*1.6; ws.push(w); sum+=w; } for(let i=0;i<N;i++) cells[i].style.width=(ws[i]/sum*W).toFixed(1)+'px';
    const want=Math.min(N-1,Math.floor((t-.45)/.11)); while(inked<want){ inked++; cells[inked].classList.add('on'); } if(t<1.6) requestAnimationFrame(frame); })(t0);
  /* in the lab the deck doesn't open: the loader finishes and the chooser comes back */
  setTimeout(()=>{ host.style.transition='opacity .4s ease'; host.style.opacity='0'; done(); setTimeout(()=>host.remove(),420); },1900); }
set(mode);
</script>
</body></html>
