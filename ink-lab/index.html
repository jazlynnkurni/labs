<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ink lab</title>
<style>
  :root {
    --paper: #efe9df;
    --ink: #23201d;
    --salmon: #d9a091;
    --line: rgba(35, 32, 29, 0.14);
    --panel: rgba(247, 243, 236, 0.92);
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  #stage { position: fixed; inset: 0; }
  #gl { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }

  /* drop target feedback */
  #drop {
    position: fixed; inset: 12px;
    border: 1.5px dashed rgba(35, 32, 29, 0.45);
    border-radius: 10px;
    display: none;
    align-items: center; justify-content: center;
    font-family: var(--mono); font-size: 12px; letter-spacing: 0.04em;
    background: rgba(239, 233, 223, 0.55);
    pointer-events: none;
    z-index: 40;
  }
  body.dragging #drop { display: flex; }

  /* panel */
  #toggle {
    position: fixed; left: 14px; bottom: 14px; z-index: 30;
    appearance: none; border: 1px solid var(--line);
    background: var(--panel); color: var(--ink);
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em;
    padding: 7px 11px; border-radius: 8px; cursor: pointer;
    backdrop-filter: blur(8px);
  }
  #toggle:hover { border-color: rgba(35, 32, 29, 0.3); }

  #panel {
    position: fixed; left: 14px; bottom: 52px; z-index: 30;
    width: 302px; max-width: calc(100vw - 28px);
    max-height: calc(100vh - 78px);
    overflow-y: auto; overscroll-behavior: contain;
    background: var(--panel);
    border: 1px solid var(--line); border-radius: 12px;
    backdrop-filter: blur(10px);
    padding: 12px 13px 14px;
    font-size: 11px;
    box-shadow: 0 12px 30px rgba(35, 32, 29, 0.1);
  }
  #panel[hidden] { display: none; }
  #panel h2 {
    font-family: var(--mono); font-size: 10px; font-weight: 500;
    letter-spacing: 0.1em; text-transform: uppercase;
    margin: 14px 0 7px; color: rgba(35, 32, 29, 0.5);
  }
  #panel h2:first-of-type { margin-top: 8px; }
  .row { display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 6px; margin-bottom: 1px; }
  .row label { font-size: 11px; color: rgba(35, 32, 29, 0.8); }
  .row .val { font-family: var(--mono); font-size: 10px; color: rgba(35, 32, 29, 0.45); }
  input[type=range] {
    grid-column: 1 / -1; width: 100%; height: 16px; margin: 0 0 6px;
    appearance: none; background: transparent; cursor: ew-resize;
  }
  input[type=range]::-webkit-slider-runnable-track { height: 2px; background: rgba(35,32,29,0.18); border-radius: 2px; }
  input[type=range]::-webkit-slider-thumb {
    appearance: none; width: 11px; height: 11px; margin-top: -4.5px;
    border-radius: 50%; background: var(--ink); border: 0;
  }
  input[type=range]::-moz-range-track { height: 2px; background: rgba(35,32,29,0.18); }
  input[type=range]::-moz-range-thumb { width: 11px; height: 11px; border: 0; border-radius: 50%; background: var(--ink); }

  .presets { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 4px; }
  .presets button, .filebtn {
    appearance: none; border: 1px solid var(--line); background: rgba(255,255,255,0.4);
    color: var(--ink); font-family: var(--mono); font-size: 10px; letter-spacing: 0.03em;
    padding: 5px 8px; border-radius: 6px; cursor: pointer;
  }
  .presets button:hover, .filebtn:hover { background: rgba(255,255,255,0.85); }
  .presets button[data-on="1"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }

  .textrow { display: flex; gap: 6px; align-items: center; margin: 2px 0 8px; }
  .textrow input[type=text] {
    flex: 1; min-width: 0; font-family: var(--mono); font-size: 11px;
    padding: 5px 7px; border-radius: 6px; border: 1px solid var(--line);
    background: rgba(255,255,255,0.5); color: var(--ink);
  }
  .note { font-size: 10px; line-height: 1.45; color: rgba(35,32,29,0.45); margin: 6px 0 0; }
  #stat { position: fixed; right: 14px; bottom: 14px; z-index: 30;
    font-family: var(--mono); font-size: 10px; color: rgba(35,32,29,0.38); }

  /* shader error overlay */
  #err {
    position: fixed; inset: 0; z-index: 100; display: none;
    background: #1b1917; color: #f2e9dd;
    font-family: var(--mono); font-size: 12px; line-height: 1.5;
    padding: 22px 24px; overflow: auto;
    white-space: pre-wrap; word-break: break-word;
  }
  #err.on { display: block; }
</style>
</head>
<body>
  <div id="stage"><canvas id="gl"></canvas></div>
  <div id="drop">drop an image to print it</div>

  <button id="toggle" type="button">controls</button>
  <div id="panel"></div>
  <div id="stat"></div>
  <pre id="err"></pre>

  <input id="file" type="file" accept="image/*" hidden>

  <script src="./shaders.js"></script>
  <script src="./segment.js"></script>
  <script src="./ui.js"></script>
  <script src="./main.js"></script>
</body>
</html>
