<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Boxing lab</title>
<style>
/* THE BOXING GIF, in code. Two fighters made only of clothes: wide trousers, a knit band or a shirt and tie, shoes,
   and two fists that float where hands would be. Every piece is a grey photo scrap with a scissor-cut white edge,
   hinged like a paper puppet: hips bob, feet shuffle, fists jab and the other one rocks back. One rig, drawn five
   ways. Nothing here is an image; every texture is made in code. */
html,body{margin:0;height:100%;background:#000;overflow:hidden;font:500 12px -apple-system,"Helvetica Neue",sans-serif}
canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none}
.tabs{position:fixed;left:50%;top:16px;transform:translateX(-50%);display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(30,30,32,.55);z-index:2;
  -webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);box-shadow:0 0 0 .5px rgba(255,255,255,.14)}
.tabs button{position:relative;z-index:1;font:inherit;color:rgba(255,255,255,.65);background:none;border:0;border-radius:999px;padding:8px 14px;cursor:pointer;transition:color .3s ease}
.tabs button.on{color:#111}
.tabs .pill{position:absolute;top:4px;left:4px;height:calc(100% - 8px);border-radius:999px;background:#fff;transition:transform .5s cubic-bezier(.34,1.4,.5,1),width .5s cubic-bezier(.34,1.4,.5,1)}
.hint{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);color:rgba(255,255,255,.4);font:500 11px ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:.28em;text-transform:uppercase;pointer-events:none;z-index:2;transition:color .4s ease}
body.light .hint{color:rgba(20,20,20,.45)}
</style></head><body>
<canvas id="c"></canvas>
<div class="tabs" id="tabs"><span class="pill" id="pill"></span></div>
<div class="hint" id="hint"></div>
<script>
const STYLES=[
  {id:'collage', name:'01 Collage',     hint:'cut from photographs',      fps:25, light:false},
  {id:'halftone',name:'02 Halftone',    hint:'printed on newsprint',      fps:12.5,light:true},
  {id:'riso',    name:'03 Riso',        hint:'two plates, out of register',fps:12.5,light:true},
  {id:'stop',    name:'04 Stop-motion', hint:'moved by hand, frame by frame',fps:10, light:true},
  {id:'spar',    name:'05 Spar',        hint:'when it is your turn, click as fast as you can', fps:30, light:true}];
let MODE=0;

const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const DW=800, DH=434, GROUND=338;           /* the design space: the GIF's 400 x 217, doubled */
const SC=document.createElement('canvas'), sx=SC.getContext('2d');   /* the scene, drawn once a frame, then printed */
let CW=0,CH=0,DPR=1,K=1,OX=0,OY=0;
function size(){ DPR=Math.min(2,devicePixelRatio||1); CW=innerWidth; CH=innerHeight; cv.width=CW*DPR; cv.height=CH*DPR;
  K=Math.min(CW/DW,CH/DH)*.92; OX=(CW-DW*K)/2; OY=(CH-DH*K)/2+10;
  SC.width=Math.round(DW*K*DPR); SC.height=Math.round(DH*K*DPR); }
size(); addEventListener('resize',size);

function rng(a){ return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

/* ---- TEXTURES: small tiles drawn once, used as patterns ---- */
function tile(w,h,fn){ const c=document.createElement('canvas'); c.width=w; c.height=h; fn(c.getContext('2d'),w,h,rng(w*7+h)); return c; }
function grain(g,w,h,R,amt,n){ for(let i=0;i<n;i++){ const v=R()<.5?255:0; g.fillStyle=`rgba(${v},${v},${v},${R()*amt})`; g.fillRect(R()*w,R()*h,1+R()*1.5,1+R()*1.5); } }
const T={
  wool: tile(96,96,(g,w,h,R)=>{ g.fillStyle='#8b8b8b'; g.fillRect(0,0,w,h);
    for(let x=0;x<w;x+=3){ g.fillStyle=`rgba(0,0,0,${.05+R()*.08})`; g.fillRect(x,0,1,h); }                     /* the weave */
    for(let i=-h;i<w;i+=5){ g.strokeStyle='rgba(255,255,255,.06)'; g.beginPath(); g.moveTo(i,0); g.lineTo(i+h,h); g.stroke(); }  /* twill */
    for(let x=0;x<w;x+=24){ g.fillStyle='rgba(255,255,255,.18)'; g.fillRect(x+R()*2,0,1,h); }                   /* chalk stripe */
    grain(g,w,h,R,.18,1600); }),
  tweed: tile(96,96,(g,w,h,R)=>{ g.fillStyle='#474747'; g.fillRect(0,0,w,h);
    for(let y=0;y<h;y+=8) for(let x=0;x<w;x+=8){ const d=((x/8+y/8)%2)?1:-1; g.strokeStyle=`rgba(255,255,255,${.06+R()*.06})`; g.beginPath(); g.moveTo(x,y+(d>0?0:8)); g.lineTo(x+8,y+(d>0?8:0)); g.stroke(); }  /* herringbone */
    grain(g,w,h,R,.22,2200); }),
  knit: tile(48,48,(g,w,h,R)=>{ g.fillStyle='#5e5e5e'; g.fillRect(0,0,w,h);
    for(let y=0;y<h;y+=6){ const band=Math.floor(y/12)%2; for(let x=0;x<w;x+=6){ g.strokeStyle=band?'rgba(220,220,220,.55)':'rgba(30,30,30,.55)'; g.lineWidth=1.6;
      g.beginPath(); g.moveTo(x,y); g.lineTo(x+3,y+5); g.lineTo(x+6,y); g.stroke(); } }
    grain(g,w,h,R,.15,400); }),
  shirt: tile(64,64,(g,w,h,R)=>{ g.fillStyle='#e6e6e4'; g.fillRect(0,0,w,h); for(let y=0;y<h;y+=2){ g.fillStyle=`rgba(0,0,0,${R()*.03})`; g.fillRect(0,y,w,1); } grain(g,w,h,R,.06,300); }),
  skin: tile(64,64,(g,w,h,R)=>{ g.fillStyle='#a2a2a2'; g.fillRect(0,0,w,h); for(let i=0;i<40;i++){ const x=R()*w,y=R()*h,r=4+R()*10, gr=g.createRadialGradient(x,y,0,x,y,r);
    gr.addColorStop(0,`rgba(${R()<.5?255:0},${R()<.5?255:0},${R()<.5?255:0},.05)`); gr.addColorStop(1,'rgba(0,0,0,0)'); g.fillStyle=gr; g.fillRect(x-r,y-r,r*2,r*2); } grain(g,w,h,R,.12,500); }),
  leather: tile(64,64,(g,w,h,R)=>{ g.fillStyle='#272727'; g.fillRect(0,0,w,h); grain(g,w,h,R,.2,900); }),
  white: tile(64,64,(g,w,h,R)=>{ g.fillStyle='#e2e2e0'; g.fillRect(0,0,w,h); grain(g,w,h,R,.1,500); }),
  tie: tile(32,32,(g,w,h,R)=>{ g.fillStyle='#202020'; g.fillRect(0,0,w,h); for(let i=-h;i<w;i+=8){ g.strokeStyle='rgba(255,255,255,.18)'; g.lineWidth=2; g.beginPath(); g.moveTo(i,0); g.lineTo(i+h,h); g.stroke(); } }),
  craft: tile(256,256,(g,w,h,R)=>{ g.fillStyle='#b99a6e'; g.fillRect(0,0,w,h); for(let i=0;i<120;i++){ g.strokeStyle=`rgba(${R()<.5?90:240},${R()<.5?60:220},40,${R()*.12})`; g.beginPath(); const x=R()*w,y=R()*h; g.moveTo(x,y); g.lineTo(x+R()*30-15,y+R()*6-3); g.stroke(); } grain(g,w,h,R,.14,4000); }),
};
const PAT={}; function pat(k,c){ return (PAT[k+(c===sx?'s':'m')]??=c.createPattern(T[k],'repeat')); }

/* ---- THE FIGHT, as events: a punch is {who, hand, t0}; it reaches out, holds, comes back; the other one rocks ---- */
let EV=[], nextAuto=0, hits=0;
function punch(who,hand,t0,landed=true){ EV.push({who,hand,t0,landed}); }
const ease=x=>1-Math.pow(1-x,3);
const back=x=>{ const c=1.6; return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2); };     /* out, a hair past, settle */
const inout=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
function curve(d){ if(d<0||d>.52) return 0; if(d<.16) return back(d/.16); if(d<.22) return 1; return 1-inout((d-.22)/.3); }
function amt(who,hand,t){ let a=0; for(const e of EV) if(e.who===who&&e.hand===hand) a=Math.max(a,curve(t-e.t0)); return a; }
function rocked(who,t){ let a=0;
  for(const e of EV) if(e.who!==who&&e.landed){ const d=t-e.t0-.13;
    if(d>0&&d<1.1){ a+=(d<.1?ease(d/.1):Math.exp(-(d-.1)*3)*(1+.3*Math.sin((d-.1)*13)*Math.exp(-(d-.1)*2.5)))*.6; } }
  return Math.min(1.7,a); }
function auto(t){
  const spar=STYLES[MODE].id==='spar';
  if(spar){ game(t); EV=EV.filter(e=>t-e.t0<1.3); return; }
  if(t>=nextAuto){ const who=spar?1:(Math.random()<.5?0:1), hand=Math.random()<.62?0:1;
    punch(who,hand,t); if(!spar&&Math.random()<.35) punch(who,1-hand,t+.22);         /* now and then a one-two */
    nextAuto=t+(spar?1.6+Math.random()*1.4:.5+Math.random()*.55); }
  EV=EV.filter(e=>t-e.t0<1.3);
}

/* ---- THE POSE of one fighter at time t, in its own frame: facing right, feet on the ground at y=0 ---- */
function pose(who,t){
  const ph=who*2.1, bob=Math.sin(t*Math.PI*2*1.7+ph)*4, sway=Math.sin(t*Math.PI*2*.47+ph)*10+Math.sin(t*Math.PI*2*1.13+ph)*3;
  const lead=amt(who,0,t), rear=amt(who,1,t), hit=rocked(who,t);
  const hx=sway+(lead+rear)*14-hit*46, hy=-158+bob+hit*7;
  const lean=.06+(lead+rear)*.14-hit*.42+Math.sin(t*Math.PI*2*.8+ph)*.03;
  /* the feet: planted, shuffling in and out with the sway; the front one lifts a little when it steps */
  const step=Math.max(0,Math.sin(t*Math.PI*2*.94+ph));
  const reach=Math.max(lead,rear);
  const fF=[66+sway*.7+reach*12-hit*20,-Math.pow(step,6)*9-hit*4], fB=[-70+sway*.35-hit*40,-Math.pow(Math.max(0,Math.sin(t*Math.PI*2*.94+ph+2.6)),6)*7-Math.sin(Math.min(1,hit)*Math.PI)*12];
  const c=Math.cos(lean), s=Math.sin(lean), sh=[hx+s*62, hy-c*62];       /* the shoulder, along the leaning torso */
  const guard=Math.sin(t*Math.PI*2*2.1+ph)*3;
  const L=[sh[0]+44+lead*150-hit*30, sh[1]+14+guard-lead*16-hit*26], R=[sh[0]+22+rear*166-hit*22, sh[1]+40-guard*.6-rear*30-hit*34];
  return {hx,hy,lean,fF,fB,L,R,lead,rear,hit};
}

/* ---- DRAWING: every piece is a path; it gets its white scissor edge, its texture, then its shading ---- */
let BOIL=.6, EDGE=4.5, EDGECOL='#f2f2f2', JR=rng(1), SHADOWS=false;
function jit(pts){ return pts.map(([x,y])=>[x+(JR()-.5)*BOIL*2,y+(JR()-.5)*BOIL*2]); }
function path(g,pts,smooth){ g.beginPath(); if(!smooth){ g.moveTo(pts[0][0],pts[0][1]); for(let i=1;i<pts.length;i++) g.lineTo(pts[i][0],pts[i][1]); g.closePath(); return; }
  const n=pts.length, m=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2]; let s=m(pts[n-1],pts[0]); g.moveTo(s[0],s[1]);
  for(let i=0;i<n;i++){ const p=pts[i], q=m(p,pts[(i+1)%n]); g.quadraticCurveTo(p[0],p[1],q[0],q[1]); } g.closePath(); }
function piece(g,pts,tex,{smooth=false,shade=null}={}){
  pts=jit(pts);
  if(SHADOWS){ g.save(); g.translate(3,5); path(g,pts,smooth); g.fillStyle='rgba(40,25,10,.28)'; g.filter='blur(2px)'; g.fill(); g.restore(); g.filter='none'; }
  if(EDGE>0){ path(g,pts,smooth); g.lineWidth=EDGE; g.lineJoin='round'; g.strokeStyle=EDGECOL; g.stroke(); }
  path(g,pts,smooth); g.fillStyle=pat(tex,g); g.fill();
  if(shade){ g.save(); path(g,pts,smooth); g.clip(); shade(g); g.restore(); }
}
function band(g,a,b,stops){ const gr=g.createLinearGradient(a[0],a[1],b[0],b[1]); stops.forEach(([o,c])=>gr.addColorStop(o,c)); g.fillStyle=gr; g.fillRect(-400,-400,800,800); }
const rot=(p,o,a)=>{ const c=Math.cos(a),s=Math.sin(a),x=p[0]-o[0],y=p[1]-o[1]; return [o[0]+x*c-y*s,o[1]+x*s+y*c]; };

function leg(g,hip,foot,tex){
  /* a wide trouser leg from hip to ankle, flaring toward the hem, with a crease down the front */
  const ank=[foot[0],foot[1]-15], dx=ank[0]-hip[0], dy=ank[1]-hip[1], L=Math.hypot(dx,dy), px=-dy/L, py=dx/L;
  const pts=[[hip[0]+px*18,hip[1]+py*18],[hip[0]-px*18,hip[1]-py*18],[ank[0]-px*40,ank[1]-py*40+2],[ank[0]+px*40,ank[1]+py*40+2]];
  piece(g,pts,tex,{shade:g=>{ band(g,[hip[0]+px*30,hip[1]],[hip[0]-px*30,hip[1]],[[0,'rgba(0,0,0,.35)'],[.45,'rgba(255,255,255,.08)'],[.55,'rgba(0,0,0,.05)'],[1,'rgba(0,0,0,.4)']]);
    g.strokeStyle='rgba(0,0,0,.25)'; g.lineWidth=1.2; g.beginPath(); g.moveTo(hip[0],hip[1]); g.lineTo(ank[0]+px*4,ank[1]); g.stroke(); }});
}
function shoe(g,foot,kind){
  const [x,y]=foot, Z=1.55, P=k=>k.map(([a,b])=>[x+a*Z,y+b*Z]);
  if(kind==='saddle'){
    piece(g,P([[-24,0],[30,0],[36,-5],[28,-12],[8,-15],[-16,-17],[-26,-10]]),'white',{smooth:true});
    piece(g,P([[-6,-1],[14,-1],[16,-13],[2,-16],[-8,-15]]),'leather',{smooth:true});                     /* the saddle */
    g.fillStyle='#1a1a1a'; g.fillRect(x-24*Z,y-3,58*Z,4);                                                       /* the sole */
  } else {
    piece(g,P([[-22,0],[32,0],[37,-6],[28,-14],[10,-17],[-12,-27],[-24,-24],[-26,-10]]),'leather',{smooth:true,
      shade:g=>{ g.fillStyle='rgba(255,255,255,.14)'; g.beginPath(); g.ellipse(x+20*Z,y-10*Z,9*Z,3*Z,-.3,0,7); g.fill(); }});
    g.fillStyle='#111'; g.fillRect(x-14*Z,y-1,8*Z,6); g.fillRect(x-24*Z,y-3,60*Z,4);                                 /* the heel and sole */
  }
}
function fist(g,c,amt,facing){
  /* a fist seen side on: a rounded block of curled fingers, knuckle lines, the thumb across the front */
  const [x,y]=c, s=1.55+amt*.12, P=k=>k.map(([a,b])=>[x+a*s,y+b*s]);
  piece(g,P([[-14,-12],[8,-15],[17,-6],[16,9],[4,15],[-12,13],[-17,1]]),'skin',{smooth:true,shade:g=>{
    band(g,[x-16,y],[x+16,y],[[0,'rgba(0,0,0,.25)'],[.6,'rgba(255,255,255,.08)'],[1,'rgba(0,0,0,.18)']]);
    g.strokeStyle='rgba(0,0,0,.35)'; g.lineWidth=1.1;
    for(let i=0;i<3;i++){ g.beginPath(); g.moveTo(x+4*s,y+(-8+i*6)*s); g.quadraticCurveTo(x+14*s,y+(-6+i*6)*s,x+15*s,y+(-3+i*6)*s); g.stroke(); }
    g.beginPath(); g.moveTo(x-10*s,y+2*s); g.quadraticCurveTo(x,y-2*s,x+9*s,y+4*s); g.stroke(); }});
}
function torso(g,who,hip,lean){
  g.save(); g.translate(hip[0],hip[1]); g.rotate(lean);
  if(who===0){ /* a knit band over the trouser top, and the cropped top of a head above it */
    piece(g,[[-25,4],[25,4],[22,-46],[-22,-46]],'knit',{shade:g=>band(g,[-25,0],[25,0],[[0,'rgba(0,0,0,.3)'],[.5,'rgba(255,255,255,.06)'],[1,'rgba(0,0,0,.35)']])});
    piece(g,[[-11,-44],[12,-44],[14,-62],[6,-76],[-6,-74],[-13,-60]],'skin',{smooth:true,shade:g=>{ g.fillStyle='rgba(20,20,20,.75)'; g.fillRect(-16,-80,32,10); }});
  } else {     /* a cropped head above the collar, then the white shirt front, its collar, the tie down the middle */
    piece(g,[[-9,-66],[11,-66],[13,-84],[5,-98],[-6,-96],[-12,-82]],'skin',{smooth:true,shade:g=>{ g.fillStyle='rgba(20,20,20,.8)'; g.fillRect(-16,-104,32,14); g.fillStyle='rgba(0,0,0,.18)'; g.fillRect(-16,-76,32,10); }});
    piece(g,[[-23,4],[23,4],[21,-70],[-19,-72]],'shirt',{shade:g=>band(g,[-23,0],[23,0],[[0,'rgba(0,0,0,.22)'],[.5,'rgba(0,0,0,0)'],[1,'rgba(0,0,0,.28)']])});
    piece(g,[[-1,-68],[6,-68],[8,-14],[3,-6],[-2,-14]],'tie');
    piece(g,[[-10,-72],[1,-66],[-6,-60]],'shirt'); piece(g,[[12,-72],[5,-66],[11,-60]],'shirt');
  }
  g.restore();
}
const FS=.74;   /* the fighters' size on the stage */
function fighter(g,who,t,baseX){
  const p=pose(who,t);
  g.save(); g.translate(baseX,GROUND); g.scale(FS,FS); if(who===1) g.scale(-1,1);
  const hip=[p.hx,p.hy], hb=rot([p.hx-10,p.hy],hip,p.lean), hf=rot([p.hx+10,p.hy],hip,p.lean);
  const trousers=who===0?'wool':'tweed', kind=who===0?'saddle':'boot';
  leg(g,hb,p.fB,trousers); shoe(g,p.fB,kind);
  fist(g,p.R,p.rear);
  torso(g,who,hip,p.lean);
  leg(g,hf,p.fF,trousers); shoe(g,p.fF,kind);
  fist(g,p.L,p.lead);
  g.restore();
  return p;
}
function scene(g,t,bg){
  g.setTransform(SC.width/DW,0,0,SC.height/DH,0,0);
  if(bg) { g.fillStyle=bg; g.fillRect(0,0,DW,DH); } else g.clearRect(0,0,DW,DH);
  fighter(g,0,t,292); fighter(g,1,t,508);
}

/* ---- PRINTING: halftone dots, two riso plates ---- */
const SM=document.createElement('canvas'), smx=SM.getContext('2d',{willReadFrequently:true});
function lum(cell){ const cols=Math.ceil(SC.width/cell), rows=Math.ceil(SC.height/cell); SM.width=cols; SM.height=rows;
  smx.drawImage(SC,0,0,cols,rows); const d=smx.getImageData(0,0,cols,rows).data, L=new Float32Array(cols*rows);
  for(let i=0;i<L.length;i++){ const a=d[i*4+3]/255; L[i]=1-(1-(d[i*4]*.3+d[i*4+1]*.59+d[i*4+2]*.11)/255)*a; } return {L,cols,rows}; }
function dots(g,{L,cols,rows},cell,ink,gamma,max,ox,oy,ang){
  g.fillStyle=ink; g.beginPath();
  const ca=Math.cos(ang), sa=Math.sin(ang);
  for(let j=0;j<rows;j++) for(let i=0;i<cols;i++){ const v=Math.pow(1-L[j*cols+i],gamma); if(v<.04) continue;
    const r=cell*.5*max*Math.sqrt(v), cx=(i+.5)*cell, cy=(j+.5)*cell, x=cx+ox+(cy-SC.height/2)*sa*.0, y=cy+oy;
    g.moveTo(x+r,y); g.arc(x,y,r,0,7); }
  g.fill();
}

/* ---- THE LOOP ---- */
let t0=performance.now(), lastTick=-1, shake=0, flash=null;
function frame(now){
  requestAnimationFrame(frame);
  const st=STYLES[MODE], fps=st.fps, tick=Math.floor((now-t0)/1000*fps); if(tick===lastTick) return; lastTick=tick;
  const t=tick/fps; auto(t); JR=rng(tick*977+MODE);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const place=()=>{ ctx.save(); let dx=0,dy=0; if(shake>0){ dx=(Math.random()-.5)*shake; dy=(Math.random()-.5)*shake; shake*=.75; } ctx.translate(OX+dx,OY+dy); ctx.scale(K/DPR*DPR/DPR,K/DPR*DPR/DPR); };
  const put=(src,filter)=>{ ctx.save(); if(filter) ctx.filter=filter; ctx.drawImage(src,OX,OY,DW*K,DH*K); ctx.restore(); };
  if(st.id==='collage'){
    BOIL=.6; EDGE=4.5; EDGECOL='#f2f2f2'; SHADOWS=false;
    ctx.fillStyle='#000'; ctx.fillRect(0,0,CW,CH);
    scene(sx,t,'#000');
    let dx=0,dy=0; if(shake>.3){ dx=(Math.random()-.5)*shake; dy=(Math.random()-.5)*shake; shake*=.72; }
    ctx.save(); ctx.translate(dx,dy); put(SC); ctx.restore();
    /* film: a fine grain over everything, and a flicker of exposure */
    ctx.save(); ctx.globalAlpha=.05+Math.random()*.03; for(let i=0;i<220;i++){ ctx.fillStyle=Math.random()<.5?'#fff':'#000'; ctx.fillRect(Math.random()*CW,Math.random()*CH,1.5,1.5); } ctx.restore();
    if(st.id==='spar'){
      /* a contact flash where a fist lands, and the tally */
      if(flash&&t-flash.t<.18){ const k=(t-flash.t)/.18, x=OX+flash.x*K, y=OY+flash.y*K; ctx.save(); ctx.strokeStyle=`rgba(255,255,255,${1-k})`; ctx.lineWidth=3;
        for(let i=0;i<10;i++){ const a=i/10*6.283, r0=10+k*30, r1=24+k*60; ctx.beginPath(); ctx.moveTo(x+Math.cos(a)*r0,y+Math.sin(a)*r0); ctx.lineTo(x+Math.cos(a)*r1,y+Math.sin(a)*r1); ctx.stroke(); } ctx.restore(); }
      ctx.fillStyle='rgba(255,255,255,.75)'; ctx.font='600 13px ui-monospace,Menlo,monospace'; ctx.fillText(`LANDED ${hits}`,OX+16,OY+28);
    }
  } else if(st.id==='halftone'||st.id==='spar'){
    BOIL=.4; EDGE=0; SHADOWS=false;
    scene(sx,t,'#fff');
    ctx.fillStyle='#ede7da'; ctx.fillRect(0,0,CW,CH);
    const cell=Math.max(4,Math.round(5*DPR)), l=lum(cell);
    let sdx=0,sdy=0; if(shake>.3){ sdx=(Math.random()-.5)*shake; sdy=(Math.random()-.5)*shake; shake*=.7; }
    ctx.save(); ctx.translate(OX+sdx,OY+sdy); ctx.scale(DW*K/SC.width,DH*K/SC.height); dots(ctx,l,cell,'#1c1a17',1.05,1.25,0,0,0); ctx.restore();
    paperGrain('#7a6a50',.05);
    if(st.id==='spar') hud(t);
  } else if(st.id==='riso'){
    BOIL=.5; EDGE=0; SHADOWS=false;
    scene(sx,t,'#fff');
    ctx.fillStyle='#F3F1ED'; ctx.fillRect(0,0,CW,CH);
    const cell=Math.max(4,Math.round(5.5*DPR)), l=lum(cell), R=rng(tick*31);
    ctx.save(); ctx.translate(OX,OY); ctx.scale(DW*K/SC.width,DH*K/SC.height); ctx.globalCompositeOperation='multiply';
    dots(ctx,l,cell,'#A99939',1.5,1.15,(R()-.5)*6*DPR,(R()-.5)*5*DPR,0);       /* gold carries the midtones */
    dots(ctx,l,cell,'#340414',2.2,1.15,(R()-.5)*3*DPR,(R()-.5)*3*DPR,0);     /* oxblood only the darks */
    ctx.restore(); paperGrain('#8a7a60',.05);
  } else if(st.id==='stop'){
    BOIL=1.6; EDGE=3.5; EDGECOL='#f6f1e6'; SHADOWS=true;
    ctx.fillStyle=ctx.createPattern(T.craft,'repeat'); ctx.fillRect(0,0,CW,CH);
    /* a soft pool of desk light */
    const gr=ctx.createRadialGradient(CW/2,CH*.45,50,CW/2,CH*.5,Math.max(CW,CH)*.7); gr.addColorStop(0,'rgba(255,240,210,.18)'); gr.addColorStop(1,'rgba(40,20,0,.35)'); ctx.fillStyle=gr; ctx.fillRect(0,0,CW,CH);
    scene(sx,t,null);
    const R=rng(tick*13), dx=(R()-.5)*2, dy=(R()-.5)*2;
    ctx.save(); ctx.translate(dx,dy); put(SC,'sepia(.35) contrast(1.05) brightness(1.02)'); ctx.restore();
  }
}
function paperGrain(col,a){ ctx.save(); ctx.globalAlpha=a; ctx.fillStyle=col; for(let i=0;i<500;i++) ctx.fillRect(Math.random()*CW,Math.random()*CH,1.2,1.2); ctx.restore(); }
requestAnimationFrame(frame);

/* SPAR, as a game of chance. A coin decides whose turn it is. Their turn: they throw a flurry and each punch may
   land on you. Your turn: three seconds, and every click is a punch that may land. Someone reaches zero: K.O. */
const G={phase:'start',until:0,you:100,them:100,combo:0,next:0,msg:'',sub:''};
const INTRO=1.1, ACT=3.2;
/* they swing first; after their turn you always get to answer; after yours, a small chance you go again */
function turn(t,mine,bonus){ G.combo=0;
  if(mine){ G.phase='yours'; G.until=t+ACT; G.msg=bonus?'BONUS ROUND':'YOUR TURN'; G.sub='click! click! click!'; document.body.style.cursor='pointer'; }
  else { G.phase='theirsIntro'; G.until=t+INTRO; G.msg='THEIR TURN'; G.sub='hold on'; document.body.style.cursor=''; } }
function game(t){
  if(G.phase==='start'){ G.you=100; G.them=100; turn(t,false); G.until=t+INTRO+.6; return; }
  if(G.phase==='ko') return;
  if(t<G.until){
    if(G.phase==='theirs'&&t>=G.next){ /* their flurry: quick and uneven, each punch a coin toss */
      const lands=Math.random()<.55; punch(1,Math.random()<.6?0:1,t,lands);
      if(lands){ G.you=Math.max(0,G.you-(4+Math.floor(Math.random()*6))); shake=10; burst(1,t); if(G.you<=0) ko(t,false); }
      G.next=t+.24+Math.random()*.3; }
    return; }
  if(G.phase==='theirsIntro'){ G.phase='theirs'; G.until=t+ACT*.8; G.next=t; return; }
  if(G.phase==='theirs'){ turn(t,true,false); return; }
  if(G.phase==='yours'){ const again=Math.random()<.22; turn(t,again,again); return; }
}
function ko(t,won){ document.body.style.cursor='pointer'; G.phase='ko'; G.msg=won?'K.O.  YOU WIN':'K.O.'; G.sub='click for a rematch'; }
function burst(who,t){ const p=pose(who,t), f=p.lead>p.rear?p.L:p.R; flash={t,x:who===0?292+f[0]*FS:508-f[0]*FS,y:GROUND+f[1]*FS}; }
let hand=0;
cv.addEventListener('pointerdown',()=>{
  if(STYLES[MODE].id!=='spar') return;
  const t=lastTick/STYLES[MODE].fps;
  if(G.phase==='ko'){ G.phase='start'; return; }
  if(G.phase!=='yours') return;
  hand=1-hand; const lands=Math.random()<.7; punch(0,hand,t,lands);
  if(lands){ G.them=Math.max(0,G.them-(2+Math.floor(Math.random()*3))); G.combo++; shake=7; burst(0,t); if(G.them<=0) ko(t,true); }
});
/* the scorecard, the turn, the flash: all in the same ink as the print */
function hud(t){
  const ink='#1c1a17', x0=OX, w=DW*K, y0=OY+18;
  ctx.save(); ctx.fillStyle=ink; ctx.strokeStyle=ink; ctx.font='700 12px ui-monospace,Menlo,monospace'; ctx.textBaseline='middle';
  const bar=(x,label,v,right)=>{ const bw=w*.3, bx=right?x-bw:x; ctx.textAlign=right?'right':'left'; ctx.fillText(label,right?x:x,y0);
    ctx.lineWidth=1.5; ctx.strokeRect(bx,y0+12,bw,10); const f=bw*v/100; ctx.fillRect(right?bx+bw-f:bx,y0+12,f,10); };
  bar(x0+24,'YOU',G.you,false); bar(x0+w-24,'THEM',G.them,true);
  if(G.phase==='yours'){ const left=Math.max(0,G.until-t), H=DH*K;
    /* the stage frame pulses in ink while it is yours */
    ctx.lineWidth=3+2*Math.abs(Math.sin(t*10)); ctx.strokeRect(OX+6,OY+6,w-12,H-12);
    /* the time you have left, draining under the banner, and what you have landed */
    const bw=w*.34, bx=x0+w/2-bw/2, by=OY+H*.2+56; ctx.lineWidth=1.5; ctx.strokeRect(bx,by,bw,8); ctx.fillRect(bx,by,bw*left/ACT,8);
    ctx.textAlign='center'; ctx.font='700 13px ui-monospace,Menlo,monospace'; ctx.fillText(`${G.combo} LANDED`,x0+w/2,by+24); }
  if(G.msg){ const big=G.phase==='ko'?56:G.phase==='yours'?52:40, pulse=G.phase==='yours'?1+.06*Math.abs(Math.sin(t*9)):1;
    ctx.textAlign='center'; ctx.font=`800 ${big*pulse}px ui-monospace,Menlo,monospace`; ctx.fillText(G.msg,x0+w/2,OY+DH*K*.2);
    if(G.sub){ ctx.font='600 12px ui-monospace,Menlo,monospace'; ctx.fillText(G.sub.toUpperCase().split('').join(' '),x0+w/2,OY+DH*K*.2+(G.phase==='yours'?34:big*.72)); } }
  if(flash&&t-flash.t<.2){ const k=(t-flash.t)/.2, x=OX+flash.x*K, y=OY+flash.y*K; ctx.lineWidth=3; ctx.globalAlpha=1-k;
    for(let i=0;i<12;i++){ const a=i/12*6.283, r0=8+k*26, r1=20+k*54+(i%2)*10; ctx.beginPath(); ctx.moveTo(x+Math.cos(a)*r0,y+Math.sin(a)*r0); ctx.lineTo(x+Math.cos(a)*r1,y+Math.sin(a)*r1); ctx.stroke(); } }
  ctx.restore();
}

/* the tabs */
const tabs=document.getElementById('tabs'), pill=document.getElementById('pill');
STYLES.forEach((s,i)=>{ const b=document.createElement('button'); b.textContent=s.name; b.onclick=()=>setMode(i); tabs.appendChild(b); });
function setMode(i){ MODE=i; const bs=[...tabs.querySelectorAll('button')]; bs.forEach((b,k)=>b.classList.toggle('on',k===i));
  pill.style.transform=`translateX(${bs[i].offsetLeft-4}px)`; pill.style.width=bs[i].offsetWidth+'px';
  document.getElementById('hint').textContent=STYLES[i].hint; document.body.classList.toggle('light',STYLES[i].light);
  for(const k in PAT) delete PAT[k]; EV=[]; nextAuto=0; lastTick=-1; G.phase='start'; document.body.style.cursor=''; try{ localStorage.setItem('boxing-mode',i); }catch(e){} }
let m0=0; try{ m0=+localStorage.getItem('boxing-mode')||0; }catch(e){} setMode(Math.min(4,Math.max(0,m0)));
</script>
