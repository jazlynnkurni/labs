<!doctype html>
<html lang="en" data-theme="dark">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>leader lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;500;600&display=swap" rel="stylesheet">
<style>
/* the home page's projects panel, in its own tokens, so only the leader changes between the five */
:root{--jak:"Plus Jakarta Sans",sans-serif;--hel:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --paper:#FAF9F7;--ink:#14171B;--ink2:rgba(20,23,27,.66);--ink3:rgba(20,23,27,.42);--plate:#FAF9F7;--outline:oklch(0 0 0 / .1)}
[data-theme="dark"]{--paper:#1C1A17;--ink:#FAF9F7;--ink2:rgba(250,249,247,.66);--ink3:rgba(250,249,247,.42);--plate:#262320;--outline:oklch(1 0 0 / .1)}
html,body{margin:0;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased}
.top{max-width:1280px;margin:0 auto;padding:32px 64px 0;display:flex;gap:16px;align-items:baseline;font:500 13px var(--jak);color:var(--ink3)}
.top b{font-weight:500;color:var(--ink)}
.top a{color:inherit;text-decoration:none}
.top .vs{margin-left:auto;display:flex;gap:4px}
.top .vs a{display:inline-flex;width:28px;height:28px;align-items:center;justify-content:center;border-radius:14px}
.top .vs a[aria-current]{color:var(--ink);box-shadow:0 0 0 1px var(--outline)}
.wrap{max-width:1280px;margin:0 auto;padding:96px 64px}
.panel{display:grid;grid-template-columns:1.1fr 1fr;gap:64px;align-items:start;position:relative}
#gl{mix-blend-mode:screen;position:absolute;inset:-40px;width:calc(100% + 80px);height:calc(100% + 80px);z-index:0;pointer-events:none;opacity:0;transition:opacity .16s ease}
#svg{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none;overflow:visible;opacity:0;transition:opacity .16s ease}
[data-theme="light"] #gl{mix-blend-mode:multiply}
.panel.hot #gl,.panel.hot #svg{opacity:1}
.rows{list-style:none;margin:0;padding:0;position:relative;z-index:2}
.rows a{display:inline-block;padding:2px 0;text-decoration:none;font:300 44px/1.15 var(--hel);letter-spacing:-.015em;color:var(--ink);transition:color .18s ease}
.panel.hot .rows a{color:var(--ink3)}
.panel.hot .rows li.on a{color:var(--ink)}
.preview{position:relative;z-index:2;border-radius:20px;padding:12px;background:var(--plate);outline:1px solid var(--outline);outline-offset:-1px;
  opacity:0;transform:translateY(6px);transition:opacity .28s ease,transform .32s cubic-bezier(.22,1,.36,1)}
.panel.hot .preview{opacity:1;transform:none}
.preview .stage{aspect-ratio:16/9;border-radius:8px;outline:1px solid var(--outline);outline-offset:-1px}
.preview p{margin:12px 4px 4px;font:400 14px/1.4 var(--hel);color:var(--ink2)}
.yr{position:absolute;z-index:3;font:500 12px var(--jak);letter-spacing:.03em;color:var(--ink3);transform:translate(-100%,-50%);
  opacity:0;transition:opacity .2s ease .16s;pointer-events:none;white-space:nowrap;font-variant-numeric:tabular-nums}
.panel.hot .yr{opacity:1}
.note{max-width:1280px;margin:0 auto;padding:0 64px 64px;font:400 14px/1.5 var(--hel);color:var(--ink3)}
</style>
<body>
<div class="top"><a href="./">leader lab</a><span>/</span><b id="name"></b>
  <nav class="vs" id="vs"></nav></div>
<div class="wrap">
  <div class="panel" id="panel">
    <canvas id="gl" aria-hidden="true"></canvas>
    <ul class="rows" id="rows"></ul>
    <div class="preview" id="preview"><div class="stage"></div><p id="pv"></p></div>
    <svg id="svg" aria-hidden="true"></svg>
    <span class="yr" id="yr"></span>
  </div>
</div>
<p class="note" id="note"></p>
<script type="module" src="lab.js"></script>
</body>
</html>
