<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>5 Glass lens</title><link rel="stylesheet" href="lab.css"></head>
<body>
<canvas id="c" aria-label="Liquid drops; drag one"></canvas>
<p class="tag"><b>5 · Glass lens.</b> Clear drops resting on your words. Each one bends the type behind it like water on glass, tinted a breath of your colour. Drag one over the letters.</p>
<script type="module">
import { mount, T, smooth, present, grain } from './liquid.js';
const cv = document.getElementById('c');

/* refraction: under a drop the words are read from a point pushed along the slope of the surface, so they
   swell and bend at the edge; outside the drops the words are drawn plain. Q = 2 to keep the type legible. */
const WORDS = ['JAZLYNN','DESIGNER','PASSIONATE','CURIOUS','CHARMING','PLAYFUL','INTERACTION','COGNITION'];
const txt = document.createElement('canvas'), tx = txt.getContext('2d'); let TD = null, tw = 0, th = 0;
function words(S) { tw = S.W; th = S.H; txt.width = tw; txt.height = th; tx.fillStyle = '#FAF9F7'; tx.fillRect(0, 0, tw, th); tx.fillStyle = '#14171B';
  const row = Math.min(54, th / 11); tx.font = `400 ${row * .86}px "Helvetica Neue", Helvetica, Arial, sans-serif`; tx.textBaseline = 'middle';
  const top = th / 2 - row * WORDS.length / 2; WORDS.forEach((w, k) => { const sp = row * .32; let x = tw / 2 - (tx.measureText(w).width + sp * (w.length - 1)) / 2;
    for (const ch of w) { tx.fillText(ch, x, top + row * (k + .5)); x += tx.measureText(ch).width + sp; } });
  TD = tx.getImageData(0, 0, tw, th).data; }
mount(cv, { Q: 2, render(S) {
  if (S.W !== tw || S.H !== th) words(S);
  const { F, R, G, B, img, w, Q, ctx, W, H } = S, D = img.data, K = 8 / T;
  for (let i = 0; i < F.length; i++) { const f = F[i], o = i * 4; if (f <= T * .9) { D[o + 3] = 0; continue; }
    const x = i % w, y = (i / w) | 0, gx = (F[i + 1] || 0) - (F[i - 1] || 0), gy = (F[i + w] || 0) - (F[i - w] || 0);
    const sx = Math.min(tw - 1, Math.max(0, (x * Q - gx * K) | 0)), sy = Math.min(th - 1, Math.max(0, (y * Q - gy * K) | 0)), p = (sy * tw + sx) * 4;
    const lip = Math.exp(-(((f - T) / (T * .07)) ** 2)) * 70, shine = Math.exp(-(((f - T * 1.3) / (T * .12)) ** 2)) * 45, tr = R[i] / f, tg = G[i] / f, tb = B[i] / f;
    D[o] = TD[p] * .93 + tr * .07 - lip + shine; D[o + 1] = TD[p + 1] * .93 + tg * .07 - lip + shine; D[o + 2] = TD[p + 2] * .93 + tb * .07 - lip + shine;
    D[o + 3] = smooth(T * .96, T * 1.04, f) * 255; }
  S.lx.putImageData(img, 0, 0); ctx.clearRect(0, 0, W, H); ctx.drawImage(txt, 0, 0, W, H); ctx.imageSmoothingEnabled = true; ctx.drawImage(S.low, 0, 0, W, H);
} });
</script>
</body></html>
