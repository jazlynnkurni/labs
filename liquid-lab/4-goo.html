<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>4 Goo</title><link rel="stylesheet" href="lab.css"></head>
<body>
<canvas id="c" aria-label="Liquid drops; drag one"></canvas>
<p class="tag"><b>4 · Goo.</b> Thick, slow liquid with a wet shine on its edge. Pull a drop away and a long string follows it out of the others, thins, and draws back.</p>
<script type="module">
import { mount, T, smooth, present, grain } from './liquid.js';
const cv = document.getElementById('c');

/* viscous: a long chain of slower drops trails each one, so pulling draws a string that thins and necks;
   a thin bright line just inside the surface reads as wet. */
const S = mount(cv, { chain: 8, render(S) { const { F, R, G, B, img } = S, D = img.data;
  for (let i = 0; i < F.length; i++) { const f = F[i], o = i * 4; if (f <= T * .9) { D[o + 3] = 0; continue; }
    const shine = Math.exp(-(((f - T * 1.3) / (T * .16)) ** 2)) * .55;
    D[o] = R[i] / f * (1 - shine) + 255 * shine; D[o + 1] = G[i] / f * (1 - shine) + 255 * shine; D[o + 2] = B[i] / f * (1 - shine) + 255 * shine;
    D[o + 3] = smooth(T * .96, T * 1.04, f) * 240; }
  present(S); } });
S.tailK = .018; S.tailD = .9; S.tailR = .48; S.tailFall = .93;
</script>
</body></html>
