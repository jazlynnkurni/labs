<!doctype html><meta charset="utf-8"><title>intro · the sheet</title><link rel="stylesheet" href="common.css">
<style>
/* THE SHEET. Her about page says it: by fifteen her work was exhibited, auctioned and sold, and most of it began
   as something picked up off the beach, sea glass, driftwood, shells, carried home to be given a second life.
   So the intro is one large sheet of paper with her found things laid out on it, each at its own slight angle,
   and a pencil line drawn through them in the order she tells it. The camera travels along that line, drawing
   it ahead of itself, turning to meet each thing square on: long moves lift high and dive, short moves stay low
   and whip. The frosted riso discs are the sea glass lying in the gaps. Photographs of her are printed in one
   riso ink; her artworks stay in their own colour. The words are only the lines she marked bold. At the end the
   camera lifts off the sheet and the whole winding line is visible, which is the point of the adventurer beat. */
:root{--ease:cubic-bezier(.45,0,.15,1)}
#stage{background:var(--paper);color:var(--ink)}
#discs{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
#world{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0;will-change:transform,filter}
#trail{position:absolute;overflow:visible;pointer-events:none}
/* THE LINE THROUGH THE PLACES. Five directions, chosen with ?line=: marker (the deck's gold stabilo, two even passes),
   pressure (the same marker swiped, thick mid-stroke and tapering where the tip lands and lifts), pencil (a thin graphite
   line with the wobble and doubled strokes of a quick sketch, always one pixel at any height), stitch (an oxblood running
   stitch sewn through the sheet, gotong royong), pebbles (a trail of small frosted pieces, the sea glass dropped along the
   way). All of them are revealed by one mask that follows the camera. */
#trail{mix-blend-mode:multiply}
#trail path,#trail polygon{stroke-linecap:round;stroke-linejoin:round}
.rg{position:absolute;width:1280px;height:720px;transform:rotate(var(--rot,0deg))}
.rg>*{position:absolute;opacity:0}
.rg.on>*,.rg.seen>*{opacity:1}
.h{font-family:var(--jak);font-weight:500;letter-spacing:-.015em;color:var(--ink);text-wrap:balance;line-height:1.38}
.lab{font-family:var(--jak);font-weight:600;font-size:10.5px;line-height:1.5;letter-spacing:.15em;text-transform:uppercase;color:var(--ink3)}
.note{font:italic 400 17px/1.5 var(--bask);color:var(--ink2)}
/* THE HIGHLIGHTER, from the case study decks: the marked words are run over with a real marker, the stroke covers the
   word height, its ends ragged and skewed the way a felt tip lands and lifts, multiplied over the type so the oxblood
   stays crisp inside the gold. It is drawn in after the sentence has printed. */
.hl{color:var(--oxblood);font-weight:600;padding:0 .08em;margin:0 -.08em;box-decoration-break:clone;-webkit-box-decoration-break:clone;mix-blend-mode:multiply;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 40' preserveAspectRatio='none'><path d='M6 6 C 60 2, 140 9, 200 5 S 330 3, 394 7 L 397 32 C 340 37, 250 30, 190 35 S 70 38, 4 33 Z' fill='%23A99939' opacity='.42'/><path d='M12 9 C 90 4, 180 12, 260 8 S 360 6, 390 10 L 392 29 C 320 33, 230 27, 150 31 S 60 34, 10 30 Z' fill='%23A99939' opacity='.2'/></svg>") no-repeat 0 55%/100% 1.08em}
.rg.on .hl{animation:mkdraw .8s cubic-bezier(.3,.7,.2,1) .75s both}
.rg.seen .hl{background-size:100% 1.08em}
@keyframes mkdraw{from{background-size:0% 1.08em}to{background-size:100% 1.08em}}
/* ARRIVALS, by kind. Sentences print: a gold pass first, a touch off register, then the ink settles. Photographs
   and prints are laid down on the paper from a little height. Stamps are stamped. Marks turn over. */
.rg.on>.say,.rg.on>.dict,.rg.on>.note{animation:fadein .8s ease both}
/* small labels, and the cover's, simply fade: the print pass reads as a glitch at that size */
.rg.on>.sub,.rg.on>.lab{animation:fadein .9s ease both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes print{0%{opacity:0;filter:blur(1.5px);transform:translate(0,6px);text-shadow:3px 2px 0 var(--gold)}60%{opacity:1;filter:blur(0);text-shadow:2px 1px 0 var(--gold)}100%{transform:none;text-shadow:0 0 0 transparent}}
.mat{background:var(--paper);outline:1px solid var(--hair);padding:8px 8px 10px;transform:rotate(var(--r,0deg));box-shadow:0 1px 2px rgba(20,23,27,.06)}
.mat img,.mat canvas{display:block}
.mat img{width:100%;aspect-ratio:4/3;object-fit:cover}
.rg.on>.mat{animation:lay .85s var(--ease) both}
@keyframes lay{0%{opacity:0;transform:translate(0,-40px) rotate(calc(var(--r,0deg) + 6deg)) scale(1.04);box-shadow:0 26px 40px rgba(20,23,27,.22)}100%{opacity:1;transform:rotate(var(--r,0deg));box-shadow:0 1px 2px rgba(20,23,27,.06)}}
.rg.on .stamp{animation:stampin .45s cubic-bezier(.2,1.4,.4,1) both}
@keyframes stampin{0%{opacity:0;transform:rotate(var(--r,0deg)) scale(1.35)}100%{opacity:1;transform:rotate(var(--r,0deg)) scale(1)}}
.rg.on .marks .tile{animation:turn .7s var(--ease) both}
@keyframes turn{0%{opacity:0;transform:rotateY(90deg)}100%{opacity:1;transform:none}}
.rg.on .row .pr{animation:lay .7s var(--ease) both}
.rg.on>*:nth-child(2),.rg.on .stamp:nth-child(2),.rg.on .marks .tile:nth-child(2),.rg.on .row .pr:nth-child(2){animation-delay:.1s}
.rg.on>*:nth-child(3),.rg.on .stamp:nth-child(3),.rg.on .row .pr:nth-child(3){animation-delay:.2s}
.rg.on>*:nth-child(4),.rg.on .stamp:nth-child(4),.rg.on .row .pr:nth-child(4){animation-delay:.3s}
.rg.on>*:nth-child(5),.rg.on .row .pr:nth-child(5){animation-delay:.4s}.rg.on>*:nth-child(6),.rg.on .row .pr:nth-child(6){animation-delay:.5s}.rg.on>*:nth-child(7),.rg.on .row .pr:nth-child(7){animation-delay:.6s}.rg.on>*:nth-child(8){animation-delay:.7s}
.rg.on .stamp:nth-child(1){animation-delay:.5s}.rg.on .stamp:nth-child(2){animation-delay:.62s}.rg.on .stamp:nth-child(3){animation-delay:.74s}.rg.on .stamp:nth-child(4){animation-delay:.86s}
/* the cover: the home page's letter wall, breathing, and nothing else */
.wall{display:flex;flex-direction:column;gap:calc(52px * .2)}
.line{display:flex;align-items:stretch}
.cell{flex:0 0 auto;height:52px;transition:background 140ms ease;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);border-left:1px solid var(--hair);display:flex;align-items:center;overflow:hidden;will-change:width}
.cell:last-child{border-right:1px solid var(--hair)}
.ch{font-family:var(--hel);font-weight:400;font-size:46.8px;line-height:1;color:var(--ink);position:relative;transition:color 140ms ease;padding-left:1.5px;white-space:pre}
.cov .wall{left:0;right:0;top:300px;align-items:center}
.cov .sub{left:0;right:0;top:262px;text-align:center}
/* salam kenal: the entry, in the deck's own dictionary type */
.salam .dict{left:0;right:0;top:0;height:720px;display:flex;flex-direction:column;justify-content:center;text-align:center}
.salam .dict .def{margin:14px auto 0}
/* the lines */
.say{left:0;right:0;top:0;height:720px;display:grid;place-items:center;text-align:center;font-size:34px;padding:0 180px}
.fore .say{padding:0 150px;font-size:30px}
.fore .marks{left:0;right:0;top:450px;display:flex;justify-content:center;gap:22px;perspective:600px}
.fore .marks .tile{width:84px;height:84px;border-radius:18px;background:#fff;outline:1px solid var(--hair);display:grid;place-items:center;overflow:hidden}
.fore .marks .tile img{width:58%;height:58%;object-fit:contain}
.knack .say{font-size:30px;padding:0 320px}
/* the stack: tools collected as postage stamps, the deck's own stamp component */
.stack .say{font-size:28px}
.stack .lab.t{left:0;right:0;top:446px;text-align:center}
.stack .stamps{left:0;right:0;top:482px;display:flex;justify-content:center;align-items:flex-start;gap:18px}
.stamp{position:relative;transform:rotate(var(--r,0deg))}
.stamp .label{color:var(--oxblood)}
.stamp p{margin:4px 0 0}
.stack .note{left:0;right:0;top:656px;text-align:center}
/* the artworks: a row of prints along the foot of the sheet; the camera walks it */
.art .say{font-size:28px;padding:0 120px}
.art .row{left:60px;top:430px;display:flex;align-items:flex-start;gap:34px;height:300px;width:2860px}
.art .row .pr{--r:0deg;height:260px;flex:0 0 auto;background:var(--paper);outline:1px solid var(--hair);padding:7px 7px 9px;box-shadow:0 1px 2px rgba(20,23,27,.06)}
.art .row .pr img{height:100%;width:auto;display:block}
.art .row .pr.s{height:210px;align-self:center}
/* the pile: photographs of her in one riso ink, with the two lines she marked */
.pile .lab.c{width:260px;line-height:1.7}
/* the labs: the side projects, six prints laid down in a fan, the line over them */
.labs .say{font-size:30px;z-index:3;text-shadow:0 0 24px var(--paper),0 0 10px var(--paper),0 0 6px var(--paper)}
.labs .mat{width:300px}
/* the two cases */
.cases .mat{width:560px}
.cases .mat img{aspect-ratio:560/346}
.cases .cap{position:absolute;left:0;right:0;top:362px;display:flex;justify-content:space-between;font:400 13.5px var(--hel);color:var(--ink)}
.cases .cap i{font:300 13px var(--hel);color:var(--ink3);font-style:normal}
.cases .say{height:150px;font-size:30px;align-items:end}
.missing{background:#EFEDE8}
.mat.missing::before{content:"";display:block;aspect-ratio:4/3;background:#EFEDE8}
.cases .mat.missing::before{aspect-ratio:560/346}
/* the look back: the whole sheet from above, her line over it */
#over{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0;transition:opacity .6s var(--ease)}
#over.on{opacity:1}
#over .h{font-size:40px;background:var(--paper);padding:10px 22px;box-shadow:0 0 0 1px var(--hair)}
.dots i{background:rgba(20,23,27,.15)}.top,.top a,.top b{color:var(--ink3)}.top b{color:var(--ink)}.hint{color:var(--ink3)}
</style>

<script>
(()=>{
const $=(h)=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstChild};
const stage=document.getElementById('stage'),world=document.getElementById('world'),over=document.getElementById('over');
const fit=()=>stage.style.setProperty('--k',Math.min(innerWidth/1280,innerHeight/720)*0.96);addEventListener('resize',fit);fit();
const img=(src,alt='')=>`<img src="${src}" onerror="this.parentElement.classList.add('missing');this.remove()" alt="${alt}">`;
const mat=(src,style,r)=>`<div class="mat" style="${style};--r:${r}deg">${img(src)}</div>`;
const stamp=(name,rot)=>`<div class="stamp" style="--r:${rot}deg"><div class="label">Tool</div><p>${name}</p></div>`;
const WORKS=[['w-sunflower',''],['art1',''],['art2',''],['art4','s'],['w-goggle',''],['art3',''],['w-spider',''],['art6','s'],['w-izakaya',''],['art5',''],['w-metropolis',''],['w-police','']];

/* ---------- the places on the sheet: x,y the centre, rot the angle it lies at, z the camera height over it ---------- */
const R=[
 {cls:'cov',x:0,y:-100,rot:0,z:1,html:`<div class="wall" id="wall"></div><div class="sub lab">Portfolio presentation</div>`},
 {cls:'salam',x:1700,y:-100,rot:-3,z:1,html:`<div class="dict"><div class="word">Salam kenal</div><div class="pron">/sa·lam kə·nal/ <span class="pos">interjection, Indonesian</span></div><div class="def">Hello!</div></div>`},
 {cls:'hi',x:3400,y:-100,rot:5,z:1.12,html:`<div class="say h">I’m Jazlynn, and I make <span class="hl">charming designs.</span></div>`},
 {cls:'fore',x:2700,y:1100,rot:-6,z:1,html:`<div class="say h">I’ve always somehow found myself at the <span class="hl">forefront of innovation</span> right before they become the next big thing.</div>
   <div class="marks"><div class="tile">${img('aster/marks/manus-glyph.svg')}</div><div class="tile">${img('aster/marks/second-self.svg')}</div></div>`},
 {cls:'knack',x:1000,y:1100,rot:2,z:1,html:`<div class="say h">I have a knack for recognizing what people might want <span class="hl">before they even realize they need it.</span></div>`},
 {cls:'stack',x:-700,y:1100,rot:-8,z:1,html:`<div class="say h">Design comes to me instinctively, but coding is something I’ve grown to love.</div>
   <div class="lab t">Here’s my stack</div>
   <div class="stamps">${stamp('Claude Code',-2)}${stamp('Cursor',1.5)}${stamp('Cognition',-1)}${stamp('Blackbox AI',2)}</div>
   <div class="note">+ my own custom AI tools</div>`},
 {cls:'art',x:-1500,y:2300,rot:0,z:.92,steps:3,pan:[0,760,1520,2280],html:`<div class="say h">I had my artworks <span class="hl">exhibited, auctioned, and sold</span> when I was 15 years old.</div>
   <div class="row">${WORKS.map(w=>`<div class="pr ${w[1]}">${img('aster/pics/'+w[0]+'.jpg')}</div>`).join('')}</div>`},
 {cls:'care',x:-1500,y:-100,rot:7,z:1.1,html:`<div class="say h">Constantly understanding and learning new forms of knowledge with <span class="hl">empathy, care, and intent</span> is a key quality that I carry in my work.</div>`},
 {cls:'pile',x:250,y:-1300,rot:-4,z:1,html:`<div class="mat ph2" data-src="aster/pics/c1.jpg" data-ink="oxblood" style="left:150px;top:230px;--r:-3deg"></div>
   <div class="mat ph2" data-src="aster/pics/c3.jpg" data-ink="charcoal" style="left:470px;top:270px;--r:2deg"></div>
   <div class="mat ph2" data-src="aster/pics/c5.jpg" data-ink="oxblood" style="left:800px;top:220px;--r:-1.5deg"></div>
   <div class="mat ph2" data-src="aster/pics/c2.jpg" data-ink="charcoal" style="left:480px;top:430px;--r:4deg;z-index:2"></div>
   <div class="lab c" style="left:150px;top:600px">Co-President at Design@Columbia</div>
   <div class="lab c" style="left:800px;top:600px;width:340px">CORE PM Lead at Columbia’s best Startup Entrepreneurship Club</div>`},
 {cls:'labs',x:1950,y:-1300,rot:6,z:.95,html:`${mat('aster/pics/lab-vertico.png','left:70px;top:70px',-5)}${mat('aster/pics/lab-pear.png','left:420px;top:40px',3)}${mat('aster/pics/lab-water.png','left:790px;top:90px',-2)}${mat('aster/pics/lab-shuffle.png','left:120px;top:380px',4)}${mat('aster/pics/lab-boxing.png','left:840px;top:400px',-4)}${mat('aster/pics/lab-porcelain.png','left:470px;top:430px',1.5)}
   <div class="say h">I can’t seem to stop creating.</div>`},
 {cls:'adv',x:3650,y:-1300,rot:-5,z:1.12,html:`<div class="say h">I’m an <span class="hl">adventurer at heart.</span></div>`},
 {cls:'look',x:1300,y:500,rot:0,z:.15,look:true,html:``},
 {cls:'cases',x:4400,y:1100,rot:0,z:1,noline:true,html:`<div class="say h">And that’s why</div>
   ${mat('aster/pics/case-eden.png','left:64px;top:200px',-1)}${mat('aster/pics/case-manus.png','left:656px;top:200px',1.2)}
   <div class="cap" style="left:64px;width:576px;top:586px"><span>Eden, the glasses that think on your phone</span><i>2026</i></div>
   <div class="cap" style="left:656px;width:576px;top:586px"><span>Manus community platform</span><i>2026</i></div>`},
];
const secs=R.map(r=>{const el=$(`<section class="rg ${r.cls}" style="left:${r.x-640}px;top:${r.y-360}px;--rot:${r.rot}deg">${r.html}</section>`);el.querySelectorAll('.say').forEach(e=>{e.innerHTML=`<span class="tx">${e.innerHTML}</span>`;});world.appendChild(el);return el;});
const KNACK=R.findIndex(r=>r.cls==='knack'), LOOK=R.findIndex(r=>r.look);

/* ---------- the letter wall, from the home page, never settling ---------- */
(function(){
  const WORDS=['JAZLYNN','KURNIANDRA'], SPEED=.23, DRIFT=.74, ROW=52, FS=ROW*.9, STRETCH=FS;
  const gauge=document.createElement('canvas').getContext('2d'); gauge.font=`400 ${FS}px "Helvetica Neue",Helvetica,Arial,sans-serif`;
  const wall=document.getElementById('wall'); const FLICK=['var(--gold)','var(--oxblood)']; let lit=0, t0=0;
  const lines=WORDS.map((w,li)=>{const el=$('<div class="line"></div>');const cells=[...w].map((ch,ci)=>{const c=$('<span class="cell"></span>'),s=$('<span class="ch"></span>');s.textContent=ch;c.appendChild(s);el.appendChild(c);
    const m=gauge.measureText(ch),ink=-(m.actualBoundingBoxLeft||0),pad=Math.max(0,FS*.1-ink);s.style.paddingLeft=pad.toFixed(1)+'px';
    return {cell:c,glyph:s,base:Math.ceil(m.width+pad)+4,ci,next:2+Math.random()*22,until:0,lit:false,col:FLICK[(Math.random()*2)|0]};});wall.appendChild(el);return {cells,seed:li};});
  const ink=(c,on)=>{if(c.lit===on)return;c.lit=on;c.cell.style.background=on?c.col:'transparent';c.glyph.style.color=on?'var(--paper)':'';};
  (function tick(now){const t=now/1000; if(!t0)t0=t; const age=t-t0, arriving=age<2.6, front=age*46;
    for(const L of lines){let x=0;const cy=L.seed*(ROW*1.2)+ROW/2;
      for(const c of L.cells){const k=.5+.5*Math.sin(t*SPEED*Math.PI*2+L.seed*DRIFT+c.ci*DRIFT*1.7);const w=c.base+k*k*STRETCH;c.cell.style.width=w.toFixed(1)+'px';
        if(arriving){const d=x+w/2+cy*.6;ink(c,d<front&&d>front-130);x+=w;continue;}
        if(c.lit&&t>c.until){ink(c,false);lit--;c.next=t+6+Math.random()*26;} else if(!c.lit&&t>c.next){ if(lit>=3){c.next=t+1+Math.random()*4;} else {ink(c,true);lit++;c.until=t+.25+Math.random()*.9;} }
        x+=w;}}
    requestAnimationFrame(tick);})(performance.now());
})();

/* ---------- the photographs of her, printed in one riso ink: an 8x8 Bayer dither, three tones ---------- */
const INKS={oxblood:[52,4,20],charcoal:[28,26,23],gold:[169,153,57]}, PAPER=[250,249,247];
const BAYER=[[0,32,8,40,2,34,10,42],[48,16,56,24,50,18,58,26],[12,44,4,36,14,46,6,38],[60,28,52,20,62,30,54,22],[3,35,11,43,1,33,9,41],[51,19,59,27,49,17,57,25],[15,47,7,39,13,45,5,37],[63,31,55,23,61,29,53,21]];
function dither(im,inkName,cssW){ const ink=INKS[inkName]||INKS.oxblood, S=2, DOT=2, w=Math.round(cssW*S), h=Math.round(w*im.naturalHeight/im.naturalWidth);
  const cw=Math.ceil(w/DOT), chh=Math.ceil(h/DOT), src=document.createElement('canvas'); src.width=cw; src.height=chh; const sc=src.getContext('2d'); sc.drawImage(im,0,0,cw,chh);
  const d=sc.getImageData(0,0,cw,chh).data, out=document.createElement('canvas'); out.width=w; out.height=h; const oc=out.getContext('2d'); const o=oc.createImageData(w,h), p=o.data;
  for(let y=0;y<h;y++){const cy=(y/DOT)|0; for(let x=0;x<w;x++){const cx=(x/DOT)|0, i=(cy*cw+cx)*4; let L=(.299*d[i]+.587*d[i+1]+.114*d[i+2])/255; L=Math.min(1,Math.max(0,(L-.5)*1.1+.5)); L=Math.pow(L,.9);
      const q=Math.min(1,Math.max(0,Math.floor(L*3+BAYER[cy&7][cx&7]/64)/3)); const j=(y*w+x)*4; p[j]=ink[0]+(PAPER[0]-ink[0])*q; p[j+1]=ink[1]+(PAPER[1]-ink[1])*q; p[j+2]=ink[2]+(PAPER[2]-ink[2])*q; p[j+3]=255; }}
  oc.putImageData(o,0,0); out.style.width=cssW+'px'; out.style.height=(h/S)+'px'; return out; }
document.querySelectorAll('.ph2').forEach((el,i)=>{const im=new Image(); im.onload=()=>{el.appendChild(dither(im,el.dataset.ink,[300,280,300,230][i%4]));}; im.onerror=()=>{el.classList.add('missing');el.innerHTML=`<div class="lab" style="width:260px;height:200px;display:grid;place-items:center">${el.dataset.src.split('/').pop()}</div>`;}; im.src=el.dataset.src;});

/* ---------- the line through the places, and the camera that travels it ----------
   Nodes are the places in her order (the artworks row contributes one node per pan stop); a Catmull-Rom curve
   through them is the pencil line on the sheet. The camera's position on a move is a point along that curve, so it
   swings into each place rather than crossing straight to it, and the line is drawn to exactly where it stands. */
const NODES=[]; R.forEach((r,i)=>{ if(r.look) return; (r.pan||[0]).forEach((dx,k)=>NODES.push({i,k,x:r.x+dx,y:r.y})); });
const nodeAt=(i,k=0)=>NODES.findIndex(n=>n.i===i&&n.k===k);
const LINE=(new URLSearchParams(location.search)).get('line')||'none'; /* she cut the drawn line; the textures stay behind ?line= */
const NS='http://www.w3.org/2000/svg', mkel=(t,at)=>{const e=document.createElementNS(NS,t);for(const k in at)e.setAttribute(k,at[k]);return e;};
const svg=document.getElementById('trail'); svg.setAttribute('viewBox','-4000 -3000 10000 7000'); svg.style.left='-4000px'; svg.style.top='-3000px'; svg.style.width='10000px'; svg.style.height='7000px';
/* the camera's own curve through the place centres (never drawn) */
let CD='M'+NODES[0].x+' '+NODES[0].y; const SEG=[];

async function go(b){ if(busy||b<0||b>=R.length) return; busy=true; const a=s; if(a===0&&b>0&&arrive==null) arrive=performance.now(); s=b; step=0; paint();
  if(R[b].look) await hover({x:R[b].x,y:R[b].y,z:R[b].z,rot:0});

  paint(true); busy=false; }
async function next(){ if(busy) return; if(R[s].steps&&step<R[s].steps){ step++; busy=true; await travel(nodeAt(s,step-1),nodeAt(s,step),{lift:0,dur:900}); await draw(LSEG[nodeAt(s,step-1)],LSEG[nodeAt(s,step)]); busy=false; return; } go(s+1); }
async function prev(){ if(busy) return; if(step){ step--; busy=true; await travel(nodeAt(s,step+1),nodeAt(s,step),{lift:0,dur:900}); busy=false; return; } go(s-1); }
