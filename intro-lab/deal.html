<!doctype html><meta charset="utf-8"><title>intro · dealt</title><link rel="stylesheet" href="common.css">
<style>
/* DEALT. Each slide is a card. Advancing deals the next one onto the table from the right, with
   the turn of a wrist; the cards underneath stay as a fanned pile at the corner, so the audience
   always sees how far in they are. The photographs are smaller cards dealt a beat later. */
#stage{background:#EFECE2}
#stage::before{content:"";position:absolute;inset:0;opacity:.5;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .4 0 0 0 0 .38 0 0 0 0 .3 0 0 0 .14 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.card{position:absolute;left:60px;top:40px;width:1160px;height:640px;border-radius:20px;background:#fff;border:2px solid var(--purple);padding:56px 64px;display:grid;grid-template-columns:580px 1fr;gap:40px;
  box-shadow:0 30px 60px -30px rgba(20,23,27,.45);transform-origin:50% 60%;transition:transform 1s cubic-bezier(.2,.8,.2,1),opacity .6s ease}
.card.wait{transform:translate(1500px,300px) rotate(28deg);opacity:0}
.card.top{transform:rotate(0deg)}
.card .lines{margin-top:14px;display:grid;gap:10px}.card .chips{margin-top:16px}.card .dict{margin-bottom:14px}
.card .pics{position:relative}
.card .ph{position:absolute;width:240px;height:168px;border:2px solid var(--purple);background-color:#fff;box-shadow:0 16px 34px -18px rgba(20,23,27,.4);transition:transform .9s cubic-bezier(.2,.8,.2,1) var(--d,0s),opacity .5s ease var(--d,0s)}
.card .p0{left:10px;top:0;--r:-4deg;--d:.25s}.card .p1{left:230px;top:110px;--r:3deg;--d:.45s;width:220px;height:154px}.card .p2{left:30px;top:250px;--r:2deg;--d:.65s;width:220px;height:150px}.card .p3{left:250px;top:330px;--r:-2.5deg;--d:.85s;width:200px;height:140px}
.card .ph{transform:rotate(var(--r))}
.card.wait .ph,.card.under .ph{transform:translate(600px,200px) rotate(30deg);opacity:0}
/* the emphasis keeps its gold on the white card */
.card .body b{color:var(--gold)}
</style>
<body><div id="stage"></div>
<div class="top"><a href="./">intro lab</a><span>/</span><b>dealt</b></div>
<script src="content.js"></script><script src="engine.js"></script>
<script>
(()=>{
  const stage=Intro.stage; let els=[]; const ROT=[-6,4,-3,5,-4];
  function build(slides,markup){ slides.forEach((s,i)=>{ const el=document.createElement('section'); el.className='card'+(i?' wait':' top'); el.innerHTML=markup(s,i); stage.appendChild(el); els.push(el); }); place(0); }
  function place(i){ els.forEach((e,k)=>{ e.classList.remove('wait','top','under'); e.style.zIndex=10+k;
      if(k>i){ e.classList.add('wait'); } else if(k===i){ e.classList.add('top'); } else { e.classList.add('under'); const d=i-k; e.style.transform=`translate(${-24*d}px,${-18*d}px) rotate(${ROT[k]*0.6}deg) scale(${1-.02*d})`; } }); }
  Intro.start({ build, go(a,b){ place(b); return new Promise(r=>setTimeout(r,1000)); }, jump(i){ els.forEach(e=>e.style.transition='none'); place(i); requestAnimationFrame(()=>els.forEach(e=>e.style.transition='')); } });
})();
</script></body>
