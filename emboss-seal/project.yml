name: EmbossSeal
options:
  bundleIdPrefix: com.jaz.experiments
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  EmbossSeal:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Emboss Seal
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMotionUsageDescription: The seal is lit by tilting the phone, so it needs the motion sensors to know which way is down.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jaz.experiments.embossseal
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
