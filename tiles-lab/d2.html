<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>d2 · wind through grass</title>
<style>
  html, body { margin: 0; height: 100%; background: #171717; overflow: hidden; -webkit-font-smoothing: antialiased; }
  canvas { display: block; width: 100vw; height: 100dvh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script>
<script src="ascii.js"></script>
<script>
/* a field of grass in wind. stalks stand in depth bands, the near ones
   tall and bright. gusts travel across as a moving noise field and bend
   each stalk from its base; a hard gust tears seeds off the tips.      */
(() => {
const A = window.ASCII, S = A.S;
let stalks = [], P, horizon = 0;
function wind(x, y, t) {
  // a broad gust field moving left to right, plus a sharper front now and then
  const g = A.fbm(x * 0.0018 - t * 0.33, y * 0.002 + t * 0.07) - 0.5;
  const front = Math.exp(-Math.pow(((x / S.W + 2 - (t * 0.16) % 3) % 3) - 1, 2) * 18);
  return g * 3.2 + front * 1.6;
}
A.start({
  cw: 8, ch: 13,
  setup() {
    P = A.particles({ gravity: 0.15 });
    stalks = [];
    horizon = Math.floor(S.ROWS * 0.5);
    const bands = 7;
    for (let b = 0; b < bands; b++) {
      const depth = b / (bands - 1);                       // 0 far, 1 near
      const baseRow = horizon + Math.round((S.ROWS - 1 - horizon) * Math.pow(depth, 1.25));
      const count = Math.round(S.COLS * (0.22 + 0.3 * depth));
      for (let k = 0; k < count; k++) {
        const i = Math.floor(A.rnd() * S.COLS);
        stalks.push({ i, base: baseRow + Math.floor(A.rnd() * 2), h: 2 + Math.round((2 + 13 * depth) * (0.45 + A.rnd() * 0.8)), depth, ph: A.rnd() * 6.28, stiff: 0.6 + A.rnd() * 0.8, seed: A.rnd() * 10 });
      }
    }
    stalks.sort((a, b) => a.depth - b.depth);
  },
  update(dt, t) {
    P.update(dt, null, b => ({ x: 0.00002 * (0.6 + wind(b.position.x, b.position.y, t)), y: -0.000004 }));
  },
  draw(t) {
    const { CW, CH, COLS } = S;
    const frame = Math.floor(t * 5);
    // the far edge of the field: a faint line
    for (let i = 0; i < COLS; i++) if (A.hash3(i, 2, frame >> 2) < 0.7) A.cell(i, horizon - 1, '_', 0.12);
    for (const s of stalks) {
      const x0 = s.i * CW;
      const w = wind(x0, s.base * CH, t) + 0.25 * Math.sin(t * 2.3 + s.ph);
      const bend = w / s.stiff;                               // cells of lean at the tip
      const bright = 0.1 + 0.8 * Math.pow(s.depth, 1.3);
      let px = 0, pxPrev = 0;
      for (let k = 0; k < s.h; k++) {
        const u = (k + 1) / s.h;
        px = bend * u * u * 7;                                // bends more toward the tip
        const i = s.i + Math.round(px), r = s.base - k;
        if (r < horizon - 1 || i < 0 || i >= COLS) break;
        const slope = px - pxPrev; pxPrev = px;
        let ch = '|';
        if (slope > 0.35) ch = '/'; else if (slope < -0.35) ch = '\\';
        if (k === s.h - 1) ch = Math.abs(slope) > 0.6 ? (slope > 0 ? '`' : '\'') : (A.hash3(s.i, 1, 3) < 0.5 ? '\'' : ',');
        A.cell(i, r, ch, bright * (0.75 + 0.25 * u));
        // the tip: seeds tear off in a hard gust
        if (k === s.h - 1 && s.depth > 0.5 && Math.abs(w) > 1.25 && A.rnd() < 0.015) P.add(i * CW + CW / 2, r * CH, w * 1.5, -1 - A.rnd(), { size: 3, life: 2 + A.rnd() * 2, drag: 0.04 });
      }
    }
  },
  overlay() { P.draw(0.6); }
});
})();
</script>
</body>
</html>
