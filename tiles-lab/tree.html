<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tiles-lab · tree</title>
<style>
  html, body { margin: 0; height: 100%; background: #171717; overflow: hidden; -webkit-font-smoothing: antialiased; }
  canvas { display: block; width: 100vw; height: 100dvh; }
  #field { position: absolute; inset: 0; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="field"></div>
<script src="tile.js?v=3"></script>
<script>
/* a bare tree, drawn soft. tiles sit at the branch tips, dark. sweep
   the cursor along a branch and they bloom; once open they stay, and
   the tree comes into leaf. the c1 colourway.                          */
(() => {
const T = window.Tile, field = document.getElementById('field');
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
const palette = { body: '#2f9be0', cross: '#e5212b', petals: ['#f4e71f', '#e2208e', '#ffffff', '#ffffff'], core: '#f7f0c2' };
const tiles = [];
let W = 0, H = 0, DPR = 1, segs = [], tips = [];

// a seeded random so the tree is the same tree every time
let seed = 7;
const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

function grow(x, y, ang, len, w, depth) {
  // a slight curve along each branch
  const bend = (rnd() - 0.5) * 0.5;
  const x2 = x + Math.cos(ang) * len, y2 = y + Math.sin(ang) * len;
  const cxp = x + Math.cos(ang + bend) * len * 0.5, cyp = y + Math.sin(ang + bend) * len * 0.5;
  segs.push({ x, y, cx: cxp, cy: cyp, x2, y2, w, depth });
  if (depth >= 7 || len < 9) { if (rnd() < 0.55) tips.push({ x: x2, y: y2, depth }); return; }   // not every twig carries a leaf
  const n = depth < 2 ? 2 : (rnd() < 0.55 ? 2 : 3);
  const spread = 0.55 + rnd() * 0.4;
  for (let k = 0; k < n; k++) {
    const a = ang + (k - (n - 1) / 2) * spread + (rnd() - 0.5) * 0.3 - 0.04;   // a touch of lift
    grow(x2, y2, a, len * (0.66 + rnd() * 0.14), w * 0.62, depth + 1);
  }
  if (depth >= 5 && rnd() < 0.12) tips.push({ x: x2, y: y2, depth });        // a few leaves grow at the forks too
}
function build() {
  seed = 7; segs = []; tips = [];
  grow(W / 2, H * 0.97, -Math.PI / 2 + 0.03, H * 0.22, Math.max(10, H * 0.016), 0);
}
let art = null;                       // the tree, drawn once, blitted every frame
function drawTree() {
  art = document.createElement('canvas'); art.width = W * DPR; art.height = H * DPR;
  const a = art.getContext('2d');
  a.setTransform(DPR, 0, 0, DPR, 0, 0);
  a.lineCap = 'round'; a.lineJoin = 'round'; a.strokeStyle = '#fff';
  const canFilter = 'filter' in a;
  // dreamy: a wide soft pass, a medium one, then a thin crisp line
  for (const [blur, alpha, wk] of [[7, 0.35, 2.2], [2.5, 0.45, 1.3], [0, 0.75, 0.7]]) {
    if (canFilter) a.filter = blur ? `blur(${blur}px)` : 'none';
    else { a.shadowColor = '#fff'; a.shadowBlur = blur * 2; }
    for (const s of segs) {
      a.globalAlpha = alpha * (1 - s.depth * 0.05);
      a.lineWidth = Math.max(1.1, s.w * wk);
      a.beginPath(); a.moveTo(s.x, s.y); a.quadraticCurveTo(s.cx, s.cy, s.x2, s.y2); a.stroke();
    }
  }
}
function paint() {
  if (!art || !art.width || !art.height) return;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#171717'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(art, 0, 0);
}
function placeTiles() {
  field.innerHTML = ''; tiles.length = 0;
  for (const p of tips) {
    const size = 34 + Math.round(rnd() * 26) + (p.depth < 6 ? 10 : 0);
    const t = T.makeTile({ x: p.x, y: p.y - size * 0.1, size, palette, scatter: 0.25 });
    field.appendChild(t.el); tiles.push(t);
  }
}
function setup() {
  if (innerWidth < 2 || innerHeight < 2) return;        // no size yet: the watcher will try again
  DPR = Math.min(2, devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  build(); drawTree(); placeTiles(); paint();
}
T.bloom(tiles, { reach: 0.9, stick: true, stickAt: 0.4, tau: 320 });   // a passing cursor is enough to set a leaf
// build as soon as the window has a size, and rebuild whenever that size changes
(function watch() { if (innerWidth !== W || innerHeight !== H) setup(); else paint(); requestAnimationFrame(watch); })();
setup();
})();
</script>
</body>
</html>
