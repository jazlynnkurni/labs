<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Manus before and after</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap">
<style>
/* Before and after, split screen: each deck takes half the window at full height, driven together by the keys */
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#0F0E0C;overflow:hidden;font:13px "Plus Jakarta Sans",sans-serif}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:4px;height:100vh}
.side{position:relative;overflow:hidden}
.tag{position:absolute;left:14px;top:10px;z-index:5;font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:11px;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.9);color:#8a8780}
.tag.n{color:#340414}
.box{position:absolute;inset:0;overflow:hidden}
.fr{position:absolute;left:0;top:0;border:0;transform-origin:0 0}
.bar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:10;display:flex;gap:8px;align-items:center;padding:6px;border-radius:999px;background:rgba(255,255,255,.92);box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}
.bar button{font:600 13px "Plus Jakarta Sans",sans-serif;padding:8px 14px;border-radius:999px;border:0;background:#fff;color:#340414;box-shadow:0 0 0 1px rgba(52,4,20,.15);cursor:pointer}
.bar button.p{background:#340414;color:#fff}
.bar select{font:500 13px "Plus Jakarta Sans",sans-serif;padding:7px 10px;border-radius:999px;border:1px solid rgba(52,4,20,.15);max-width:280px}
</style></head><body><div class="pair"><div class="side"><span class="tag">Before</span><div class="box"><iframe class="fr" id="A" src="old/deck.html"></iframe></div></div>
<div class="side"><span class="tag n">After</span><div class="box"><iframe class="fr" id="B" src="new/deck.html"></iframe></div></div></div>
<div class="bar"><button id="prev">&larr;</button><select id="sel"><option value="0">1. Redesigning the Manus AI community so new users stay.</option><option value="1">2. Manus asked what would make new users stay.</option><option value="2">3. 01 Context</option><option value="3">4. The problem statement</option><option value="4">5. The work ran in six stages over three months.</option><option value="5">6. The data pinpointed that the failure was in converting acquired users </option><option value="6">7. The main reason was that Manus shipped capabilities faster than users </option><option value="7">8. The community page was key to turning new users into active ones but f</option><option value="8">9. 02 Discovery</option><option value="9">10. New users could not tell what Manus could do for them.</option><option value="10">11. In 13 interviews, the same three pain points kept surfacing.</option><option value="11">12. The problem also extended to power users who had no structured way to </option><option value="12">13. No existing community gave power users fast feedback and lasting contr</option><option value="13">14. 03 Solution</option><option value="14">15. To fix conversion, I organised the redesign of the community page arou</option><option value="15">16. 04 Testing</option><option value="16">17. First, I tested whether points and levels would drive engagement.</option><option value="17">18. Second, I moved to a static structure to make the products legible.</option><option value="18">19. So I tested the two opposites to find a middle.</option><option value="19">20. Testers found the gamified version overwhelming and could not say what</option><option value="20">21. Testers found the static version clear but lost interest, lingering on</option><option value="21">22. That pointed to a guided approach, refined over three rounds.</option><option value="22">23. I challenged the PM on one design because each new role would break th</option><option value="23">24. 05 Final design</option><option value="24">25. So I proposed a dashboard that guides every user to a first contributi</option><option value="25">26. The redesign answers each pain point with one part of the design.</option><option value="26">27. Before build, stakeholder sessions gave every recommendation an owner </option><option value="27">28. The final design brought role, path and events into one dashboard.</option><option value="28">29. The AI-guided path reflects each user’s role back to them.</option><option value="29">30. Recommendations take on new roles without a layout change.</option><option value="30">31. 06 Measuring</option><option value="31">32. Public launch will answer three open questions.</option><option value="32">33. Internal testing already backs the hypothesis on clarity and retention</option><option value="33">34. In conclusion, guidance kept people where game mechanics did not.</option><option value="34">35. How can we scale this work across Manus?</option></select><button class="p" id="next">Next in both &rarr;</button><button id="play">Replay into next</button></div>
<script>
const A=document.getElementById('A'),B=document.getElementById('B'),sel=document.getElementById('sel'),its=[];let cur=0;
const key=(f,k)=>{const d=f.contentDocument;if(!d)return;const o={key:k,code:k,bubbles:true};d.dispatchEvent(new KeyboardEvent('keydown',o));};
const press=k=>[A,B].forEach(f=>key(f,k));
function jump(n){const was=cur;cur=n;[A,B].forEach(f=>{try{const w=f.contentWindow;if(w.__at===n)return;w.go(n);w.__at=n;}catch(e){}});sel.value=n;}
sel.onchange=()=>jump(+sel.value);addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();document.getElementById('next').click();}if(e.key==='ArrowLeft'){document.getElementById('prev').click();}});
document.getElementById('next').onclick=()=>{press('ArrowRight');[A,B].forEach(f=>{try{f.contentWindow.__at=undefined;}catch(e){}});};
document.getElementById('prev').onclick=()=>{press('ArrowLeft');[A,B].forEach(f=>{try{f.contentWindow.__at=undefined;}catch(e){}});};
document.getElementById('play').onclick=()=>{[A,B].forEach(f=>{try{f.contentWindow.__at=undefined;}catch(e){}});const n=cur;[A,B].forEach(f=>{try{f.contentWindow.go(n===0?1:n);if(n===0)f.contentWindow.go(0);}catch(e){}});setTimeout(()=>{press('ArrowRight');},1600);};
[A,B].forEach(f=>f.addEventListener('load',()=>{try{f.contentWindow.__at=0;}catch(e){}}));
const fit=()=>document.querySelectorAll('.box').forEach(b=>{const f=b.firstChild,W=b.clientWidth,H=b.clientHeight;f.style.width=W*2+'px';f.style.height=H*2+'px';f.style.transform='scale(.5)';});addEventListener('resize',fit);fit();
</script></body></html>
