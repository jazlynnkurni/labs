<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Device icons lab</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600&display=swap">
<style>
/* Five pairs of icons for the glasses and the iPhone, in the Eden deck's ink and olive, shown at slide size
   and small, so the pair can be chosen for "Both groups split the work" and "One agent with different jobs". */
:root{--ink:#14171B;--moss:#3E4F1A;--olive:#6B7A3A;--sage:#C4D4A4}
*{box-sizing:border-box}
body{margin:0;background:#EDEBE6;color:var(--ink);font:15px/1.45 "Helvetica Neue",Helvetica,Arial,sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:40px 32px 80px}
h1{font:600 24px "Plus Jakarta Sans",sans-serif;margin:0 0 6px}
.lede{color:#6f6b64;margin:0 0 28px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:20px}
.opt{background:#fff;border-radius:18px;padding:24px 26px}
.lab{font:600 12px "Plus Jakarta Sans",sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--moss);margin:0}
.lab small{display:block;font:400 13px "Helvetica Neue",sans-serif;letter-spacing:0;text-transform:none;color:#6f6b64;margin-top:3px}
.pair{display:flex;align-items:flex-end;justify-content:space-around;gap:20px;margin:22px 0 14px;height:140px}
.pair svg.g{width:200px;height:auto}.pair svg.p{height:130px;width:auto}
.mini{display:flex;gap:16px;align-items:center;padding-top:12px;border-top:1px solid rgba(20,23,27,.12)}
.mini svg.g{width:56px;height:auto}.mini svg.p{height:36px;width:auto}
.mini span{font:500 12px "Plus Jakarta Sans",sans-serif;color:#6f6b64;margin-left:auto}
</style></head><body>
<div class="wrap">
<h1>Device icons lab</h1>
<p class="lede">Five pairs for the glasses and the iPhone. Each is shown at slide size and small. Tell me the number.</p>
<div class="grid" id="g"></div>
</div>
<script>
const I='#14171B', M='#3E4F1A', O='#6B7A3A', S='#C4D4A4';
const SETS=[
 ['01','Line, current','The deck’s outline style, refined: even 3px strokes, a HUD bar in one lens, three lines on the screen.',
  `<svg class="g" viewBox="0 0 260 110"><g fill="none" stroke="${I}" stroke-width="3" stroke-linejoin="round"><rect x="20" y="26" width="96" height="62" rx="24"/><rect x="144" y="26" width="96" height="62" rx="24"/><path d="M116 48q14-12 28 0M20 44 4 36M240 44l16-8"/></g><rect x="38" y="44" width="40" height="7" rx="3.5" fill="${M}"/></svg>`,
  `<svg class="p" viewBox="0 0 70 130"><rect x="4" y="3" width="62" height="124" rx="14" fill="none" stroke="${I}" stroke-width="3"/><rect x="25" y="11" width="20" height="6" rx="3" fill="${I}"/><rect x="14" y="30" width="38" height="7" rx="3.5" fill="${M}"/><rect x="14" y="43" width="30" height="7" rx="3.5" fill="${O}" opacity=".7"/><rect x="14" y="56" width="34" height="7" rx="3.5" fill="${O}" opacity=".45"/></svg>`],
 ['02','Solid duotone','Filled in olive with a lighter sage glass; reads at a glance, warmer than line art.',
  `<svg class="g" viewBox="0 0 260 110"><path d="M116 48q14-12 28 0" fill="none" stroke="${M}" stroke-width="7" stroke-linecap="round"/><path d="M22 42 6 34M238 42l16-8" stroke="${M}" stroke-width="7" stroke-linecap="round"/><rect x="16" y="22" width="104" height="70" rx="28" fill="${M}"/><rect x="140" y="22" width="104" height="70" rx="28" fill="${M}"/><rect x="26" y="32" width="84" height="50" rx="20" fill="${S}"/><rect x="150" y="32" width="84" height="50" rx="20" fill="${S}"/><rect x="38" y="46" width="36" height="7" rx="3.5" fill="#fff"/></svg>`,
  `<svg class="p" viewBox="0 0 70 130"><rect x="2" y="2" width="66" height="126" rx="16" fill="${M}"/><rect x="8" y="8" width="54" height="114" rx="11" fill="${S}"/><rect x="26" y="13" width="18" height="5" rx="2.5" fill="${M}"/><rect x="15" y="32" width="40" height="22" rx="6" fill="#fff"/><rect x="15" y="60" width="40" height="7" rx="3.5" fill="#fff" opacity=".8"/></svg>`],
 ['03','Thin and airy','1.5px hairlines with generous space; the HUD and the screen shown as soft glows.',
  `<svg class="g" viewBox="0 0 260 110"><g fill="none" stroke="${I}" stroke-width="1.6"><path d="M18 48c0-14 6-22 24-22h52c18 0 24 8 24 22s-8 36-34 36H52c-26 0-34-22-34-36zM142 48c0-14 6-22 24-22h52c18 0 24 8 24 22s-8 36-34 36h-32c-26 0-34-22-34-36z"/><path d="M118 46q12-8 24 0M18 46 2 40M242 46l16-6"/></g><ellipse cx="62" cy="52" rx="26" ry="12" fill="${S}" opacity=".7"/></svg>`,
  `<svg class="p" viewBox="0 0 70 130"><rect x="5" y="3" width="60" height="124" rx="15" fill="none" stroke="${I}" stroke-width="1.6"/><rect x="27" y="10" width="16" height="5" rx="2.5" fill="none" stroke="${I}" stroke-width="1.4"/><rect x="14" y="40" width="42" height="40" rx="10" fill="${S}" opacity=".7"/></svg>`],
 ['04','Rounded glyph','Like an SF Symbol: one weight, round caps and joins, nothing inside; pure silhouettes.',
  `<svg class="g" viewBox="0 0 260 110"><g fill="none" stroke="${M}" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"><circle cx="70" cy="58" r="34"/><circle cx="190" cy="58" r="34"/><path d="M104 56q26-16 52 0M36 50 16 40M224 50l20-10"/></g></svg>`,
  `<svg class="p" viewBox="0 0 70 130"><rect x="7" y="6" width="56" height="118" rx="16" fill="none" stroke="${M}" stroke-width="9"/><path d="M28 112h14" stroke="${M}" stroke-width="7" stroke-linecap="round"/></svg>`],
 ['05','Scene, with the HUD','Each device showing what it does: a glanceable card in the lens, a fuller screen on the phone.',
  `<svg class="g" viewBox="0 0 260 110"><g fill="none" stroke="${I}" stroke-width="3" stroke-linejoin="round"><rect x="20" y="22" width="100" height="68" rx="20"/><rect x="140" y="22" width="100" height="68" rx="20"/><path d="M120 46q10-10 20 0M20 42 4 34M240 42l16-8"/></g><rect x="30" y="34" width="80" height="44" rx="10" fill="#0E0F10"/><circle cx="41" cy="67" r="4" fill="none" stroke="${S}" stroke-width="1.6"/><rect x="50" y="44" width="48" height="5" rx="2.5" fill="${S}"/><rect x="50" y="54" width="34" height="4" rx="2" fill="${S}" opacity=".55"/></svg>`,
  `<svg class="p" viewBox="0 0 70 130"><rect x="4" y="3" width="62" height="124" rx="14" fill="none" stroke="${I}" stroke-width="3"/><rect x="25" y="10" width="20" height="6" rx="3" fill="${I}"/><rect x="12" y="24" width="46" height="26" rx="8" fill="${S}"/><rect x="12" y="56" width="46" height="9" rx="4.5" fill="none" stroke="${O}" stroke-width="1.6"/><rect x="12" y="70" width="21" height="16" rx="5" fill="${O}" opacity=".35"/><rect x="37" y="70" width="21" height="16" rx="5" fill="${O}" opacity=".35"/><rect x="20" y="106" width="30" height="10" rx="5" fill="${M}"/></svg>`]];
document.getElementById('g').innerHTML=SETS.map(([n,t,d,g,p])=>`<section class="opt"><p class="lab">${n} ${t}<small>${d}</small></p><div class="pair">${g}${p}</div><div class="mini">${g}${p}<span>small</span></div></section>`).join('');
</script>
</body></html>
