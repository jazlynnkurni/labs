<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Horse folder</title>
<script type="importmap">
{ "imports": {
  "react": "https://esm.sh/react@18.3.1",
  "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
  "htm": "https://esm.sh/htm@3.1.1"
} }
</script>
<style>
  :root { --s: min(78vmin, 680px); }
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; -webkit-font-smoothing: antialiased; }
  body { display: grid; place-items: center; }
  #root { display: contents; }
  /* the folder's box is the reference's 736 grid; the folder sits from 93 to 646 of it and the
     reflection hangs below, so the pair is centred as one */
  .scene { position: relative; width: var(--s); height: var(--s); margin-top: calc(var(--s) * -0.06); margin-bottom: calc(var(--s) * 0.18); }
  .scene > .folder, .scene > .mirror { position: absolute; inset: 0; }
  /* the floor: the same folder mirrored about its bottom edge, faint, soft, fading out */
  .mirror {
    transform-origin: 50% calc(646 / 736 * 100%); transform: scaleY(-1);
    opacity: .12; filter: blur(calc(var(--s) * 0.007));
    -webkit-mask-image: linear-gradient(to bottom, transparent 52%, #000 87.6%, transparent 87.8%);
            mask-image: linear-gradient(to bottom, transparent 52%, #000 87.6%, transparent 87.8%);
    pointer-events: none;
  }
  .folder, .mirror { pointer-events: none; }
  /* hover: the front sheet lifts 4 px and casts a shadow on what is behind it (the reflection, flipped, drops away) */
  .fold-front { transition: transform 240ms cubic-bezier(.22, 1, .36, 1); will-change: transform; }
  .lift-shadow { transition: opacity 240ms cubic-bezier(.22, 1, .36, 1); }
  .scene[data-phase="hover"] .fold-front { transform: translateY(-4px); }
  .scene[data-phase="hover"] .lift-shadow { opacity: .22; }
  /* drag-over: the front sheet tips forward on its bottom edge like a pocket being opened, the dark
     inside shows behind its top edge, and a faint light runs along the opening */
  .fold-front { transform-origin: 50% calc(646 / 736 * 100%); }
  .lip { transition: opacity 200ms cubic-bezier(.22, 1, .36, 1); }
  .scene[data-phase="dragover"] .fold-front { transform: perspective(1600px) rotateX(-8deg) scaleY(.955); }   /* the top edge drops about 9 px: the pocket shows */
  .scene[data-phase="dragover"] .lip { opacity: 1; }
  /* receiving keeps the pocket open while the slips go in; success closes it gently, slower than it opened */
  .scene[data-phase="receiving"] .fold-front { transform: perspective(1600px) rotateX(-8deg) scaleY(.955); }
  .scene[data-phase="receiving"] .lip { opacity: 1; }
  .scene[data-phase="success"] .fold-front, .scene[data-phase="rejected"] .fold-front { transition-duration: 460ms; transition-timing-function: cubic-bezier(.32, .72, 0, 1); }
  /* a paper slip: an aged index card with a folded corner and a few ruled lines, the file's extension on it */
  .slip { position: absolute; width: calc(78 / 736 * 100%); height: calc(98 / 736 * 100%); border-radius: calc(3 / 736 * var(--s));
          background: linear-gradient(rgba(120,110,95,.0) 0 26%, rgba(120,110,95,.16) 26% 27%, transparent 27% 40%, rgba(120,110,95,.16) 40% 41%, transparent 41% 54%, rgba(120,110,95,.16) 54% 55%, transparent 55%), #ece6da;
          box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 1px 2px -1px rgba(0,0,0,.12), 0 4px 10px rgba(0,0,0,.14); will-change: transform; }
  .slip i { position: absolute; right: 0; top: 0; width: 22%; height: 17.6%; background: linear-gradient(225deg, #fff 0 50%, #d8d0c1 50%); border-bottom-left-radius: 2px; }
  .slip span { position: absolute; left: 12%; bottom: 10%; font: 500 calc(11 / 736 * var(--s)) / 1 ui-monospace, "SF Mono", Menlo, monospace; color: #6f665a; }
  /* the line underneath: quiet, enters with a little lift, leaves by fading */
  .note { position: absolute; left: 0; right: 0; top: calc(668 / 736 * 100%); text-align: center; pointer-events: none;
          opacity: 0; transform: translateY(4px); transition: opacity 220ms ease-out, transform 220ms ease-out; }
  .note[data-show="true"] { opacity: 1; transform: none; }
  .note p { margin: 0; font: 500 13px/1.4 -apple-system, "SF Pro Text", system-ui, sans-serif; color: #3d3d3d; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 16px; }
  .note .sub { font-weight: 400; font-size: 12px; color: #8a8a8a; margin-top: 2px; }
  /* open: the front sheet tips open and the index card rises out of the pocket in front of everything */
  .scene[data-phase="open"] .fold-front { transform: perspective(1600px) rotateX(-8deg) scaleY(.955); }
  .veil { position: fixed; inset: 0; z-index: 1; }
  .card { position: absolute; z-index: 2; left: calc(86 / 736 * 100%); right: calc(86 / 736 * 100%); top: calc(150 / 736 * 100%); max-height: calc(450 / 736 * 100%);
          display: flex; flex-direction: column; padding: 20px 8px 12px 24px; border-radius: 14px; outline: none; color: #2f2b26;
          background: linear-gradient(180deg, #efe9dd, #e8e1d3); font: 400 14px/1.45 -apple-system, "SF Pro Text", system-ui, sans-serif;
          box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 1px 2px -1px rgba(0,0,0,.06), 0 2px 4px 0 rgba(0,0,0,.04), 0 18px 40px -12px rgba(30,26,20,.35);
          animation: rise 420ms cubic-bezier(.22, 1, .36, 1) both; transition: box-shadow 160ms ease-out; }
  .card[data-over="true"] { box-shadow: 0 0 0 1px rgba(150,190,235,.9), 0 0 0 4px rgba(150,190,235,.25), 0 18px 40px -12px rgba(30,26,20,.35); }
  /* it comes up out of the folder's mouth: the top edge leads, the rest unrolls behind it */
  @keyframes rise { from { transform: translateY(56px); clip-path: inset(0 0 100% 0 round 14px); } 60% { clip-path: inset(0 0 0 0 round 14px); } to { transform: none; clip-path: inset(0 0 0 0 round 14px); } }
  .card header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; padding-right: 8px; }
  .card h2 { margin: 0; font-size: 15px; font-weight: 600; text-wrap: balance; }
  .card .count { margin: 0; font-size: 12px; color: #8a8175; font-variant-numeric: tabular-nums; }
  .card ul { list-style: none; margin: 16px 0 0; padding: 0 8px 0 0; overflow: auto; flex: 1; min-height: 0; }
  .card li { display: flex; align-items: center; border-top: 1px solid rgba(120,110,95,.2); }
  .card li:last-child { border-bottom: 1px solid rgba(120,110,95,.2); }
  .card li a { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; min-height: 40px; color: inherit; text-decoration: none; border-radius: 6px; padding: 0 4px; }
  .card .ext { flex: none; width: 44px; font: 500 11px/1 ui-monospace, "SF Mono", Menlo, monospace; color: #8a8175; }
  .card .name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .meta { flex: none; font-size: 12px; color: #8a8175; font-variant-numeric: tabular-nums; }
  .card .meta:last-child { width: 48px; text-align: right; }
  .card button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; transition: transform 120ms ease-out, background-color 160ms ease-out; }
  .card button:active { transform: scale(.96); }
  .card .x, .card .rm { flex: none; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 10px; color: #8a8175; }
  .card .x svg, .card .rm svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; }
  .card .empty { margin: 16px 8px 0 0; color: #8a8175; text-wrap: pretty; }
  .card footer { display: flex; align-items: center; gap: 16px; margin-top: 16px; padding-right: 8px; }
  .card .add { min-height: 40px; padding: 0 16px; border-radius: 10px; background: rgba(60,52,40,.08); font-weight: 500; }
  .card .msg { margin: 0; font-size: 12px; color: #8a8175; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .undo { font-weight: 600; color: #2f2b26; padding: 0 4px; min-height: 40px; }
  .card a:focus-visible, .card button:focus-visible { outline: 2px solid rgba(110,150,200,.9); outline-offset: 1px; }
  @media (hover: hover) {
    .card li a:hover { background: rgba(60,52,40,.05); }
    .card .x:hover, .card .rm:hover, .card .add:hover { background: rgba(60,52,40,.08); }
  }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  /* the target: the folder's own footprint (53 to 683 across, 93 to 646 down), focusable */
  .hit { position: absolute; left: calc(53 / 736 * 100%); top: calc(93 / 736 * 100%); width: calc(630 / 736 * 100%); height: calc(553 / 736 * 100%);
         border-radius: calc(40 / 736 * var(--s)); cursor: pointer; outline: none; }
  .hit:focus-visible { box-shadow: 0 0 0 2px #fff, 0 0 0 4px rgba(150, 190, 235, .9); }
  @media (prefers-reduced-motion: reduce) {
    .fold-front, .lift-shadow { transition: none; }
    .scene[data-phase="hover"] .fold-front, .scene[data-phase="dragover"] .fold-front { transform: none; }
    .lip { transition: none; }
    .scene[data-phase="receiving"] .fold-front { transform: none; }
    .note { transition: opacity 220ms ease-out; transform: none; }
    .scene[data-phase="open"] .fold-front { transform: none; }
    .card { animation: fade 160ms ease-out both; }
    @keyframes fade { from { opacity: 0; } }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="module">
  import React from 'react';
  import { createRoot } from 'react-dom/client';
  import { HorseFolder } from './HorseFolder.js';
  createRoot(document.getElementById('root')).render(React.createElement(HorseFolder));
</script>
</body>
</html>
