<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>horse-folder-lab · folders</title>
<style>
  :root { --ink: #1a1a1a; --mute: #6b6b6b; }
  html, body { margin: 0; background: #fff; color: var(--ink); font: 14px/1.5 -apple-system, "SF Pro Text", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  main { max-width: 1280px; margin: 0 auto; padding: 48px 24px 96px; }
  .eyebrow { font-size: 12px; color: var(--mute); margin: 0 0 8px; }
  h1 { font-size: 24px; font-weight: 600; margin: 0 0 8px; text-wrap: balance; }
  .lede { color: var(--mute); margin: 0 0 32px; max-width: 640px; text-wrap: pretty; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  @media (max-width: 900px) { .pair { grid-template-columns: 1fr; } }
  figure { margin: 0; }
  figcaption { font-size: 12px; color: var(--mute); margin-top: 8px; }
  .frame { position: relative; aspect-ratio: 1; }
  .frame > * { position: absolute; inset: 0; width: 100%; height: 100%; }
  .frame img.ghost { opacity: 0; transition: opacity 200ms ease-out; }
  .onion .frame img.ghost { opacity: .5; }
  button { margin-top: 24px; font: inherit; padding: 8px 16px; border-radius: 999px; border: 0; background: #f2f2f2; color: var(--ink); cursor: pointer; transition: transform 120ms ease-out; }
  button:active { transform: scale(.96); }
</style>
</head>
<body>
<main id="main">
  <p class="eyebrow">Stage 1 · folder geometry</p>
  <h1>Three folders, measured off the reference</h1>
  <p class="lede">Flat fills and gradients only, with a soft contact shadow and ambient depth. No horses, scratches or grain yet. Onion skin lays the reference over the build at 50%.</p>
  <div class="pair">
    <figure>
      <div class="frame">
        <!-- the component: one SVG in the reference's own 736 grid, so the folder fills 86% of the width -->
        <svg viewBox="0 0 736 736" role="img" aria-label="Three overlapping stone-grey folders">
          <defs>
            <linearGradient id="gBackLeft" x1="0" y1="93" x2="0" y2="230" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="rgb(151,151,151)"/><stop offset=".45" stop-color="rgb(141,145,148)"/><stop offset="1" stop-color="rgb(134,137,139)"/>
            </linearGradient>
            <linearGradient id="gBackRight" x1="0" y1="144" x2="0" y2="230" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="rgb(133,136,138)"/><stop offset="1" stop-color="rgb(130,132,134)"/>
            </linearGradient>
            <!-- the front: cool and lit at the top, falling to a warmer, darker grey low down (row means of the reference) -->
            <linearGradient id="gFront" x1="0" y1="201" x2="0" y2="646" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="rgb(176,180,183)"/>
              <stop offset=".14" stop-color="rgb(166,170,173)"/>
              <stop offset=".40" stop-color="rgb(143,147,149)"/>
              <stop offset=".50" stop-color="rgb(133,134,132)"/>
              <stop offset=".84" stop-color="rgb(135,134,130)"/>
              <stop offset=".91" stop-color="rgb(128,125,120)"/>
              <stop offset="1" stop-color="rgb(134,130,124)"/>
            </linearGradient>
            <filter id="depth" x="-10%" y="-10%" width="120%" height="125%">
              <feDropShadow dx="0" dy="8" stdDeviation="11" flood-color="#000" flood-opacity=".14"/>
              <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#000" flood-opacity=".16"/>
            </filter>
            <clipPath id="frontClip"><path id="frontShape" d="M89 201 H647 A36 36 0 0 1 683 237 V604 A42 42 0 0 1 641 646 H95 A42 42 0 0 1 53 604 V237 A36 36 0 0 1 89 201 Z"/></clipPath>
          </defs>
          <g filter="url(#depth)">
            <!-- back-right: wide, slightly darker, runs right; its left end tucks behind the back-left folder -->
            <rect x="200" y="144" width="471" height="200" rx="32" fill="url(#gBackRight)"/>
            <rect x="200.5" y="144.5" width="470" height="199" rx="31.5" fill="none" stroke="rgba(255,255,255,.28)"/>
            <!-- back-left: tall, rises above everything; its right side drops straight onto the strip -->
            <rect x="64" y="93" width="245" height="260" rx="30" fill="url(#gBackLeft)"/>
            <rect x="64.5" y="93.5" width="244" height="259" rx="29.5" fill="none" stroke="rgba(255,255,255,.28)"/>
            <!-- front -->
            <use href="#frontShape" fill="url(#gFront)"/>
            <g clip-path="url(#frontClip)" stroke="rgb(70,66,62)" stroke-opacity=".22" stroke-width="1">
              <path d="M53 599.5 H683 M53 607.5 H683 M53 615.5 H683"/>
            </g>
            <use href="#frontShape" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="1" transform="translate(0 0)"/>
          </g>
        </svg>
        <img class="ghost" src="ref.png" alt="">
      </div>
      <figcaption>Build</figcaption>
    </figure>
    <figure>
      <div class="frame"><img src="ref.png" alt="The reference"></div>
      <figcaption>Reference</figcaption>
    </figure>
  </div>
  <button id="tog">Onion skin</button>
</main>
<script>
  const m = document.getElementById('main'), b = document.getElementById('tog');
  b.addEventListener('click', () => { m.classList.toggle('onion'); b.textContent = m.classList.contains('onion') ? 'Hide onion skin' : 'Onion skin'; });
</script>
</body>
</html>
