<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crowd sink lab</title>
<style>
:root{--bg:#0e0e0e;--ink:#f2f2f2;--mute:#8b8b8b;--line:#262626}
*{box-sizing:border-box}
html{-webkit-font-smoothing:antialiased}
body{margin:0;background:var(--bg);color:var(--ink);font:12px/1.45 -apple-system,"SF Pro Text",Inter,system-ui,sans-serif;letter-spacing:-.005em;overflow:hidden}
.top{position:fixed;inset:0 0 auto 0;z-index:5;display:flex;align-items:center;gap:8px;height:44px;padding:0 16px;background:rgba(14,14,14,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top h1{font-size:12px;font-weight:600;margin:0 12px 0 0}
.tab{height:26px;padding:0 10px;border:0;border-radius:6px;background:none;color:var(--mute);font:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.tab kbd{font:inherit;color:#555}
.tab:hover{background:#1e1e1e;color:var(--ink)}
.tab[aria-selected="true"]{background:var(--ink);color:#0e0e0e}
.tab[aria-selected="true"] kbd{color:#777}
.top .sp{flex:1}
.sw{height:26px;padding:0 10px;border:0;border-radius:6px;background:none;box-shadow:0 0 0 1px var(--line);color:var(--mute);font:inherit;cursor:pointer}
.sw[aria-pressed="true"]{background:#2a2a2a;color:var(--ink)}
#stage{position:fixed;inset:44px 0 0 0;display:grid;place-items:center}
#frame{position:relative;width:min(100vw - 48px,calc((100vh - 44px - 48px) * 1.779));aspect-ratio:500/281;background:#000;box-shadow:0 0 0 1px #222}
canvas{display:block;width:100%;height:100%}
#ref{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;opacity:0;pointer-events:none;transition:opacity .16s ease-out}
#side{position:fixed;right:16px;bottom:16px;z-index:4;width:300px;display:grid;gap:8px}
#side img{width:300px;aspect-ratio:500/281;display:block;border-radius:6px;box-shadow:0 0 0 1px #2a2a2a}
#side .cap{display:flex;justify-content:space-between;color:var(--mute)}
#side .cap b{font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
#ctl{position:fixed;left:16px;bottom:16px;z-index:4;width:300px;padding:12px 14px;border-radius:8px;background:rgba(22,22,22,.9);backdrop-filter:blur(10px);box-shadow:0 0 0 1px var(--line);display:grid;gap:6px}
#ctl label{display:grid;grid-template-columns:62px 1fr 44px;align-items:center;gap:8px;color:var(--mute)}
#ctl label b{font-weight:500;color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
#ctl input[type=range]{width:100%;accent-color:#ddd;height:18px;margin:0}
#ctl .row{display:flex;gap:6px;margin-top:4px}
#ctl .row button{flex:1}
#note{position:fixed;left:16px;top:60px;z-index:4;max-width:360px;margin:0;padding:10px 12px;border-radius:8px;background:rgba(14,14,14,.82);backdrop-filter:blur(10px);color:var(--mute)}
#note b{color:var(--ink);font-weight:500}
#scrub{position:fixed;left:50%;bottom:16px;translate:-50% 0;z-index:4;width:min(420px,40vw);display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;color:var(--mute);font-variant-numeric:tabular-nums}
#scrub input{width:100%;accent-color:#ddd;margin:0}
#scrub .n{min-width:52px;text-align:right}
@media (max-width:900px){#side,#note{display:none}#ctl{width:240px}}
</style>
</head>
<body data-d="1">
<div class="top">
  <h1>Crowd sink</h1>
  <button class="tab" data-d="1" aria-selected="true"><kbd>1</kbd>Photo</button>
  <button class="tab" data-d="2"><kbd>2</kbd>Mono</button>
  <button class="tab" data-d="3"><kbd>3</kbd>Stencil</button>
  <button class="tab" data-d="4"><kbd>4</kbd>Riso</button>
  <button class="tab" data-d="5"><kbd>5</kbd>Halftone</button>
  <span class="sp"></span>
  <button class="sw" id="overlay" aria-pressed="false">Overlay ref</button>
  <button class="sw" id="step" aria-pressed="false">25 fps steps</button>
  <button class="sw" id="pause" aria-pressed="false">Pause</button>
</div>

<div id="stage">
  <div id="frame">
    <canvas id="c"></canvas>
    <img id="ref" alt="">
  </div>
</div>

<p id="note"></p>

<div id="scrub"><span>frame</span><input type="range" id="t" min="0" max="20" step="1" value="0"><span class="n" id="tn">1 / 21</span></div>

<div id="ctl">
  <label>period <input type="range" id="period" min="0.4" max="14" step="0.02"><b></b></label>
  <label>spokes <input type="range" id="spokes" min="40" max="320" step="4"><b></b></label>
  <label>pitch <input type="range" id="pitch" min="0.6" max="3" step="0.05"><b></b></label>
  <label>near <input type="range" id="near" min="0.4" max="3" step="0.05"><b></b></label>
  <label>sink y <input type="range" id="vpy" min="-0.6" max="0.6" step="0.01"><b></b></label>
  <label>sink x <input type="range" id="vpx" min="0.2" max="0.8" step="0.01"><b></b></label>
  <label>spin <input type="range" id="spin" min="-90" max="90" step="1"><b></b></label>
  <label>size <input type="range" id="size" min="0.5" max="2" step="0.05"><b></b></label>
  <label>spread <input type="range" id="spread" min="0" max="1" step="0.05"><b></b></label>
  <div class="row"><button class="sw" id="copy">Copy preset</button><button class="sw" id="resetp">Reset</button></div>
</div>

<div id="side">
  <img id="sideimg" alt="">
  <div class="cap"><span>study this.GIF</span><span><b id="sidef">1</b> / 21 · 40 ms</span></div>
</div>

<script type="module">
/* ---------- what the GIF does ----------
   21 frames at 40 ms, seamless. People lying on their backs in long radial queues, heads
   toward one point just above the top centre, soles toward a still, wide, downward lens.
   Every queue slides into that point and is swallowed. The loop closes because every body
   advances exactly one body length per loop, so frame 21 is frame 1 with the queues shifted.

   The bodies here are the GIF's own people, lifted out of the frames by Vision's foreground
   segmentation, levelled so the body runs along x with the head at the left, then placed
   on the same sink geometry: a body at ground distance d sits at screen radius near*H/d
   from the sink and is near*H*pitch/(d(d+pitch)) long. Drawn far to near.               */

const MOTION = {period:.84, spokes:168, pitch:1.4, near:1.4, vpy:-.08, vpx:.5, spin:0, size:1.15, spread:.55};
const PRESETS = {
  1:{name:'Photo', style:'photo', bg:'#d6ecee', ...MOTION,
     note:'<b>Photo.</b> The GIF’s own people, cut out and re-queued into the sink on its pale sky. Overlay ref lays the source frame over the render in sync; the scrubber and [ ] step both.'},
  2:{name:'Mono', style:'mono', bg:'#0b0b0b', ...MOTION,
     note:'<b>Mono.</b> Same cut-outs, greyscale with the contrast lifted, on black. The costume goes, the pile stays photographic.'},
  3:{name:'Stencil', style:'stencil', bg:'#FFF5EF', ...MOTION,
     note:'<b>Stencil.</b> Every body cut to two tones, ink and paper, thresholded from its own luminance. A screen print of the crowd, bodies still occluding each other.'},
  4:{name:'Riso', style:'riso', bg:'#F3EBE2', ...MOTION,
     note:'<b>Riso.</b> One ink, plum, laid over paper: the luminance of each body becomes ink density, like a single-drum riso pass with the grain left in.'},
  5:{name:'Halftone', style:'half', bg:'#ffffff', ...MOTION,
     note:'<b>Halftone.</b> Each body re-screened as a dot grid, black on white, dot size from darkness. Near bodies read as photos, the sink becomes a moiré of grain.'},
};
const P = {...PRESETS[1]};

/* ---------- sprites and their treated variants ---------- */
const man = await (await fetch('ref/cut/manifest.json')).json();
const sprites = await Promise.all(man.map(m => new Promise(res => { const im = new Image(); im.onload = () => res({...m, im, v: {}}); im.src = 'ref/cut/' + m.file; })));
const lum = (r, g, b) => (.2126 * r + .7152 * g + .0722 * b);
function treated(sp, style){
  if (sp.v[style]) return sp.v[style];
  const c = document.createElement('canvas'); c.width = sp.w; c.height = sp.h; const x = c.getContext('2d');
  if (style === 'photo') { x.drawImage(sp.im, 0, 0); return sp.v[style] = c; }
  if (style === 'mono') { x.filter = 'grayscale(1) contrast(1.3) brightness(1.05)'; x.drawImage(sp.im, 0, 0); return sp.v[style] = c; }
  x.drawImage(sp.im, 0, 0);
  const id = x.getImageData(0, 0, sp.w, sp.h), d = id.data;
  if (style === 'stencil') {
    for (let i = 0; i < d.length; i += 4) { if (d[i + 3] < 40) { d[i + 3] = 0; continue; } const l = lum(d[i], d[i + 1], d[i + 2]); const ink = l < 118; d[i] = ink ? 5 : 255; d[i + 1] = ink ? 5 : 245; d[i + 2] = ink ? 5 : 239; d[i + 3] = 255; }
    x.putImageData(id, 0, 0); return sp.v[style] = c;
  }
  if (style === 'riso') {
    const ink = [0x34, 0x04, 0x14], pap = [0xF3, 0xEB, 0xE2];
    for (let i = 0; i < d.length; i += 4) { if (d[i + 3] < 40) { d[i + 3] = 0; continue; } let t = 1 - lum(d[i], d[i + 1], d[i + 2]) / 255; t = Math.min(1, Math.max(0, (t - .08) * 1.35)); t = Math.round(t * 5) / 5; d[i] = pap[0] + (ink[0] - pap[0]) * t; d[i + 1] = pap[1] + (ink[1] - pap[1]) * t; d[i + 2] = pap[2] + (ink[2] - pap[2]) * t; d[i + 3] = 255; }
    x.putImageData(id, 0, 0); return sp.v[style] = c;
  }
  if (style === 'half') {
    const o = document.createElement('canvas'); o.width = sp.w; o.height = sp.h; const y = o.getContext('2d');
    y.fillStyle = '#fff'; y.beginPath();
    const cell = 7;
    // paper inside the body first, so bodies behind never show through the dots
    y.drawImage(sp.im, 0, 0); y.globalCompositeOperation = 'source-in'; y.fillRect(0, 0, sp.w, sp.h); y.globalCompositeOperation = 'source-over';
    y.fillStyle = '#050505'; y.beginPath();
    for (let gy = cell / 2; gy < sp.h; gy += cell) for (let gx = cell / 2; gx < sp.w; gx += cell) {
      const i = ((gy | 0) * sp.w + (gx | 0)) * 4; if (d[i + 3] < 100) continue;
      const r = (1 - lum(d[i], d[i + 1], d[i + 2]) / 255) * cell * .62; if (r < .4) continue;
      y.moveTo(gx + r, gy); y.arc(gx, gy, r, 0, 6.2832);
    }
    y.fill(); return sp.v[style] = o;
  }
}

/* ---------- the queues ---------- */
const srand = s => { let a = s >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; };
let spokes = [];
function build(){
  const rng = srand(1137); spokes = [];
  for (let j = 0; j < P.spokes; j++) spokes.push({
    th: (j + (rng() - .5) * .9) / P.spokes * 2 * Math.PI, phase: rng(), lane: (rng() - .5), mirror: rng() < .5 ? -1 : 1,
    tilt: (rng() - .5) * .28, sp: Math.floor(rng() * sprites.length), s: .85 + rng() * .3,
  });
}

/* ---------- the frame ---------- */
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
const frameEl = document.getElementById('frame');
let W = 500, H = 281, dpr = 1;
function resize(){ dpr = Math.min(devicePixelRatio, 2); W = frameEl.clientWidth; H = frameEl.clientHeight; canvas.width = W * dpr; canvas.height = H * dpr; }
new ResizeObserver(resize).observe(frameEl);

function paint(u, spinAng){
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = P.bg; ctx.fillRect(0, 0, W, H);
  ctx.imageSmoothingQuality = 'medium';
  const vx = P.vpx * W, vy = P.vpy * H, F = P.near * H, pitch = P.pitch;
  const maxR = Math.hypot(W, H) * 1.1;
  const K = Math.ceil(Math.sqrt(F * pitch / .6) / pitch) + 1;   // past this a body is under a pixel long
  for (let k = K; k >= 0; k--) {                                  // far first, so near bodies paint over far ones
    const d0 = 1 + (k + u) * pitch;                               // every loop the whole queue steps one body into the sink
    if (F / d0 - F * pitch / (d0 * d0) > maxR) continue;
    for (let j = 0; j < spokes.length; j++) {
      const f = spokes[j], d = d0 + f.phase * pitch;              // each queue carries its own offset, so no rings
      const rho = F / d, L = F * pitch * .92 / (d * (d + pitch)) * P.size * f.s;
      if (L * dpr < .6) continue;
      const th = f.th + spinAng * Math.min(1, 3 / d);
      const c = Math.cos(th), s = Math.sin(th);
      const lane = f.lane * P.spread * L * .9;
      const cx = vx + c * (rho - L * .5) - s * lane, cy = vy + s * (rho - L * .5) + c * lane;
      if (cx < -L || cx > W + L || cy < -L || cy > H + L) continue;
      const sp = sprites[f.sp], img = treated(sp, P.style), h = L * sp.h / sp.w;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.translate(cx, cy); ctx.rotate(th + f.tilt); ctx.scale(1, f.mirror);
      ctx.drawImage(img, -L * .5, -h * .5, L, h);
    }
  }
}

/* ---------- time, loop, scrub ---------- */
const ref = document.getElementById('ref'), sideimg = document.getElementById('sideimg'), sidef = document.getElementById('sidef');
const scrub = document.getElementById('t'), tn = document.getElementById('tn');
let paused = false, stepped = false, t0 = performance.now(), hold = 0, scrubbing = false;
const refSrc = i => `ref/f${String(i + 1).padStart(3, '0')}.png`;
function loopTime(){ if (paused) return hold; return ((performance.now() - t0) / 1000) % P.period; }
function render(){
  let t = loopTime();
  if (stepped) t = Math.floor(t / P.period * 21) / 21 * P.period;
  const u = t / P.period;
  const spinStep = Math.round(P.spin / 360 * P.spokes) * (2 * Math.PI / P.spokes); // whole spoke steps keep the seam closed
  paint(u, spinStep * u);
  const fi = Math.min(20, Math.floor(u * 21)), src = refSrc(fi);
  if (sideimg.dataset.i !== String(fi)) { sideimg.src = src; ref.src = src; sideimg.dataset.i = fi; sidef.textContent = fi + 1; tn.textContent = `${fi + 1} / 21`; if (!scrubbing) scrub.value = fi; }
  requestAnimationFrame(render);
}
scrub.addEventListener('pointerdown', () => { scrubbing = true; });
addEventListener('pointerup', () => { scrubbing = false; });
scrub.addEventListener('input', () => { paused = true; pauseBtn.setAttribute('aria-pressed', 'true'); hold = (+scrub.value + .01) / 21 * P.period; });

/* ---------- controls ---------- */
const keys = ['period','spokes','pitch','near','vpy','vpx','spin','size','spread'];
const inputs = Object.fromEntries(keys.map(k => [k, document.getElementById(k)]));
const fmt = k => k === 'period' ? `${P[k]} s` : k === 'spin' ? `${P[k]}°` : k === 'spokes' ? String(P[k]) : (+P[k]).toFixed(2).replace(/0$/, '');
function syncUI(){ for (const k of keys) { inputs[k].value = P[k]; inputs[k].nextElementSibling.textContent = fmt(k); } }
for (const k of keys) inputs[k].addEventListener('input', () => { P[k] = +inputs[k].value; syncUI(); if (k === 'spokes') build(); });
document.getElementById('copy').onclick = () => navigator.clipboard.writeText(JSON.stringify(Object.fromEntries(keys.map(k => [k, P[k]]))));
document.getElementById('resetp').onclick = () => { Object.assign(P, MOTION); select(+document.body.dataset.d); };
const tog = (id, fn) => { const b = document.getElementById(id); b.onclick = () => { const on = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', on); fn(on); }; return b; };
tog('overlay', on => { ref.style.opacity = on ? .5 : 0; });
tog('step', on => { stepped = on; });
const pauseBtn = tog('pause', on => { paused = on; if (on) hold = loopTime(); else t0 = performance.now() - hold * 1000; });

function select(d){
  const keep = Object.fromEntries(keys.map(k => [k, P[k]]));   // the motion carries across treatments
  Object.assign(P, PRESETS[d], keep);
  document.body.dataset.d = d;
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', b.dataset.d == d));
  document.getElementById('note').innerHTML = P.note;
  syncUI(); build(); resize();
  history.replaceState(null, '', '?d=' + d);
}
document.querySelectorAll('.tab').forEach(b => b.onclick = () => select(+b.dataset.d));
addEventListener('keydown', e => {
  if (e.target.matches('input')) return;
  if (/^[1-5]$/.test(e.key)) select(+e.key);
  if (e.key === ' ') { e.preventDefault(); pauseBtn.click(); }
  if (e.key === '[' || e.key === ']') { paused = true; pauseBtn.setAttribute('aria-pressed', 'true'); const fi = Math.floor(loopTime() / P.period * 21); const nf = (fi + (e.key === ']' ? 1 : 20)) % 21; hold = (nf + .01) / 21 * P.period; }
  if (e.key === 'o') document.getElementById('overlay').click();
});

for (let i = 0; i < 21; i++) { const im = new Image(); im.src = refSrc(i); }
Object.assign(P, MOTION);
select(+(new URLSearchParams(location.search).get('d') || 1));
render();
</script>
</body>
</html>
